version: '3.8'
services:
  db:
    image: postgres:15
    container_name: 4school-db
    environment:
      POSTGRES_DB: 4school
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  nginx:
    image: nginx:latest
    container_name: 4school-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx:/etc/nginx/conf.d
      - ./nginx/ssl:/etc/nginx/ssl
    depends_on:
      - db
    networks:
      - school_network

volumes:
  postgres_data:

networks:
  school_network:
    driver: bridge
