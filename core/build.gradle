plugins {
    id 'java-library'
    id 'org.jetbrains.kotlin.jvm'
    id 'org.jetbrains.kotlin.plugin.spring'
    id 'org.springframework.boot'
    id 'io.spring.dependency-management'
    id 'org.jetbrains.kotlin.plugin.jpa'
}

dependencies {
    api 'org.springframework.boot:spring-boot-starter-data-jpa'
    api 'org.springframework.boot:spring-boot-starter-security'
    api 'org.springframework.boot:spring-boot-starter-validation'
    api 'org.jetbrains.kotlin:kotlin-reflect'
    api 'com.fasterxml.jackson.module:jackson-module-kotlin'
    api 'org.flywaydb:flyway-core'
    api 'org.flywaydb:flyway-database-postgresql'
    api 'org.springframework.ai:spring-ai-starter-model-google-genai'
    api 'org.springframework:spring-aop'
	api 'org.aspectj:aspectjweaver'
    api 'com.bucket4j:bucket4j-core:8.10.1'
    api 'org.dhatim:fastexcel:0.17.0'
    api 'org.jsoup:jsoup:1.17.2'
    api 'io.jsonwebtoken:jjwt-api:0.12.3'
	api 'io.jsonwebtoken:jjwt-impl:0.12.3'
	api 'io.jsonwebtoken:jjwt-jackson:0.12.3'
    api 'org.springframework.boot:spring-boot-starter-mail'
    api 'org.springframework.boot:spring-boot-starter-web'
    runtimeOnly 'org.postgresql:postgresql'
}

sourceSets {
	main {
		kotlin {
			exclude 'com/haneef/_school/service/DataInitializationService.kt'
		}
	}
}

bootJar {
    enabled = false
}

jar {
    enabled = true
}
