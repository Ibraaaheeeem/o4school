version: '3.8'

services:
  app:
    build:
      context: ..
      dockerfile: Dockerfile
    image: ghcr.io/ibraaaheeeem/o4school:${APP_VERSION:-latest}
    container_name: 4school_app
    restart: always
    ports:
      - "${HOST_PORT:-8080}:8080"
    environment:
      - DB_URL=jdbc:postgresql://4school_db:5432/j4school
      - DB_USERNAME=${DB_USERNAME}
      - DB_PASSWORD=${DB_PASSWORD}
      - ELEARNER_DB_URL=jdbc:postgresql://4school_db:5432/elearner
      - ELEARNER_DB_USERNAME=${DB_USERNAME}
      - ELEARNER_DB_PASSWORD=${DB_PASSWORD}
      - JWT_SECRET=${JWT_SECRET}
      - PAYSTACK_SECRET_KEY=${PAYSTACK_SECRET_KEY}
      - PAYSTACK_PUBLIC_KEY=${PAYSTACK_PUBLIC_KEY}
      - SMTP_SERVER=${SMTP_SERVER}
      - SMTP_PORT=${SMTP_PORT}
      - SMTP_USERNAME=${SMTP_USERNAME}
      - SMTP_PASSWORD=${SMTP_PASSWORD}
      - SENDER_EMAIL=${SENDER_EMAIL}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - WHATSAPP_ACCESS_TOKEN=${WHATSAPP_ACCESS_TOKEN}
      - WHATSAPP_PHONE_NUMBER_ID=${WHATSAPP_PHONE_NUMBER_ID}
      - WHATSAPP_BUSINESS_ACCOUNT_ID=${WHATSAPP_BUSINESS_ACCOUNT_ID}
      - WHATSAPP_VERIFY_TOKEN=${WHATSAPP_VERIFY_TOKEN}
      - SQUAD_SECRET_KEY=${SQUAD_SECRET_KEY}
      - SQUAD_PUBLIC_KEY=${SQUAD_PUBLIC_KEY}
      - SQUAD_BENEFICIARY_ACCOUNT=${SQUAD_BENEFICIARY_ACCOUNT}
      - HOSTAFRICA_API_USERNAME=${HOSTAFRICA_API_USERNAME}
      - HOSTAFRICA_API_TOKEN=${HOSTAFRICA_API_TOKEN}
    depends_on:
      - db
    networks:
      - school_network

  db:
    image: postgres:15-alpine
    container_name: 4school_db
    restart: always
    ports:
      - "127.0.0.1:5432:5432"
    environment:
      - POSTGRES_DB=j4school
      - POSTGRES_USER=${DB_USERNAME}
      - POSTGRES_PASSWORD=${DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-db.sql:/docker-entrypoint-initdb.d/init-db.sql
    networks:
      - school_network

  prometheus:
    image: prom/prometheus:latest
    container_name: 4school_prometheus
    restart: unless-stopped
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    ports:
      - "9090:9090"
    networks:
      - school_network

  grafana:
    image: grafana/grafana:latest
    container_name: 4school_grafana
    restart: unless-stopped
    volumes:
      - grafana_data:/var/lib/grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
    networks:
      - school_network
    depends_on:
      - prometheus

volumes:
  postgres_data:
  prometheus_data:
  grafana_data:

networks:
  school_network:
    driver: bridge
