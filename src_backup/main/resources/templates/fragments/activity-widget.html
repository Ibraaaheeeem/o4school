<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

</head>

<body>
    <!-- User-specific Activity Widget Fragment -->
    <div th:fragment="user-activity-widget(userId)" class="activity-widget" id="user-activity-widget"
        th:attr="data-user-id=${userId}">
        <style>
            .activity-widget {
                background: var(--bg-card);
                border-radius: var(--radius-lg);
                border: 1px solid var(--border-color);
                overflow: hidden;
                box-shadow: var(--shadow-sm);
                margin-top: 1rem;
            }

            .activity-widget-header {
                display: flex;
                justify-content: space-between;
                align-items: center;
                padding: 1rem 1.25rem;
                border-bottom: 1px solid var(--border-color);
                background: rgba(248, 250, 252, 0.5);
            }

            .activity-widget-title {
                font-size: 0.95rem;
                font-weight: 700;
                color: var(--text-main);
                margin: 0;
                display: flex;
                align-items: center;
                gap: 0.5rem;
            }

            .activity-widget-refresh {
                background: rgba(79, 70, 229, 0.05);
                border: 1px solid rgba(79, 70, 229, 0.2);
                color: var(--primary-color);
                cursor: pointer;
                font-size: 0.75rem;
                padding: 0.5rem 1rem;
                border-radius: 30px;
                transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
                font-weight: 700;
                display: flex;
                align-items: center;
                gap: 0.5rem;
                letter-spacing: 0.02em;
            }

            .activity-widget-refresh:hover {
                background: var(--primary-color);
                color: white;
                border-color: var(--primary-color);
                box-shadow: 0 4px 12px rgba(79, 70, 229, 0.25);
                transform: translateY(-1px);
            }

            .activity-widget-refresh:active {
                transform: translateY(0);
                background: #4338ca;
            }

            .activity-widget-refresh i {
                font-size: 0.75rem;
            }

            .activity-widget-refresh.spinning i {
                animation: rotate 1s linear infinite;
            }

            @keyframes rotate {
                from {
                    transform: rotate(0deg);
                }

                to {
                    transform: rotate(360deg);
                }
            }

            .activity-widget-list {
                display: flex;
                flex-direction: column;
            }

            .activity-widget-item {
                display: flex;
                gap: 1rem;
                padding: 1.25rem 1.5rem;
                border-bottom: 1px solid var(--border-color);
                transition: background 0.2s ease;
            }

            .activity-widget-item:hover {
                background: var(--bg-hover);
            }

            .activity-widget-item:last-child {
                border-bottom: none;
            }

            .activity-widget-icon {
                width: 42px;
                height: 42px;
                border-radius: 12px;
                background: white;
                border: 1px solid var(--border-color);
                display: flex;
                align-items: center;
                justify-content: center;
                font-size: 1.25rem;
                flex-shrink: 0;
                box-shadow: 0 2px 5px rgba(0, 0, 0, 0.03);
            }

            .activity-widget-content {
                flex: 1;
                min-width: 0;
            }

            .activity-widget-title-text {
                font-size: 0.95rem;
                font-weight: 600;
                color: var(--text-main);
                margin: 0 0 0.15rem 0;
            }

            .activity-widget-description {
                color: var(--text-muted);
                font-size: 0.875rem;
                margin: 0 0 0.4rem 0;
                line-height: 1.5;
            }

            .activity-widget-meta {
                font-size: 0.75rem;
                color: var(--text-light);
                font-weight: 500;
                display: flex;
                align-items: center;
                gap: 0.5rem;
            }

            .user-badge {
                background: #f1f5f9;
                color: #475569;
                padding: 0.1rem 0.6rem;
                border-radius: 4px;
                font-size: 0.7rem;
                font-weight: 600;
            }

            .activity-widget-time {
                font-size: 0.75rem;
                color: var(--text-light);
                white-space: nowrap;
                margin-left: auto;
                padding-left: 1rem;
            }

            .no-activities,
            .loading-activities,
            .error-activities {
                text-align: center;
                padding: 3.5rem 2rem;
                color: var(--text-muted);
                font-size: 0.9rem;
            }

            .error-activities {
                color: #ef4444;
                display: flex;
                flex-direction: column;
                align-items: center;
                gap: 1rem;
            }

            .error-activities i {
                font-size: 2rem;
                opacity: 0.5;
            }

            .error-activities button {
                margin-top: 0.5rem;
            }

            .loading-activities i {
                margin-right: 0.5rem;
                color: var(--primary-color);
            }
        </style>
        <div class="activity-widget-header">
            <h3 class="activity-widget-title">
                <i class="fas fa-history" style="color: var(--primary-color);"></i>
                Recent Activity
            </h3>
            <button class="activity-widget-refresh" onclick="refreshUserActivities()">
                <i class="fas fa-sync-alt"></i> Refresh
            </button>
        </div>

        <div id="user-activity-list" class="activity-widget-list" th:attr="data-user-id=${userId}">
            <div class="loading-activities">
                <i class="fas fa-spinner fa-spin"></i> Loading your activity...
            </div>
        </div>
    </div>

    <script th:fragment="activity-widget-script">
        function refreshUserActivities(specificUserId) {
            const userActivityList = document.getElementById('user-activity-list');
            if (!userActivityList) return;

            // Get userId: passed param > list dataset > widget dataset
            const targetUserId = specificUserId ||
                userActivityList.dataset.userId ||
                document.getElementById('user-activity-widget')?.dataset.userId;

            if (!targetUserId) {
                console.warn('Activity Widget: No userId found');
                userActivityList.innerHTML = '<div class="no-activities">No user context found</div>';
                return;
            }

            const refreshBtn = document.querySelector('.activity-widget-refresh');
            if (refreshBtn) refreshBtn.classList.add('spinning');

            userActivityList.innerHTML = '<div class="loading-activities"><i class="fas fa-spinner fa-spin"></i> Syncing activities...</div>';

            fetch(`/admin/activities/api/user/${targetUserId}?limit=5`)
                .then(response => {
                    if (refreshBtn) setTimeout(() => refreshBtn.classList.remove('spinning'), 600);
                    if (!response.ok) throw new Error('Network response was not ok');
                    return response.json();
                })
                .then(data => {
                    const activities = data.activities || [];

                    if (activities.length === 0) {
                        userActivityList.innerHTML = '<div class="no-activities">No recent activity found.</div>';
                        return;
                    }

                    userActivityList.innerHTML = activities.map(activity => `
                        <div class="activity-widget-item">
                            <div class="activity-widget-icon">${activity.icon || '📋'}</div>
                            <div class="activity-widget-content">
                                <h4 class="activity-widget-title-text">${activity.title}</h4>
                                ${activity.description ? `<p class="activity-widget-description">${activity.description}</p>` : ''}
                                <div class="activity-widget-meta">
                                    <span class="user-badge">${activity.userRole}</span>
                                    ${activity.targetUserName ? `<span><i class="fas fa-arrow-right" style="font-size: 0.7rem;"></i> ${activity.targetUserName}</span>` : ''}
                                </div>
                            </div>
                            <div class="activity-widget-time">${activity.timeAgo}</div>
                        </div>
                    `).join('');
                })
                .catch(error => {
                    console.error('Error loading user activities:', error);
                    userActivityList.innerHTML = `
                        <div class="error-activities">
                            <i class="fas fa-exclamation-circle"></i>
                            <div>Failed to load activities</div>
                            <button class="activity-widget-refresh" onclick="refreshUserActivities('${targetUserId}')">
                                <i class="fas fa-sync-alt"></i> Try Again
                            </button>
                        </div>
                    `;
                });
        }

        // Load activities on DOM ready
        document.addEventListener('DOMContentLoaded', function () {
            const widget = document.getElementById('user-activity-widget');
            if (widget) {
                refreshUserActivities();
                // Optional: Auto-refresh every 60 seconds
                setInterval(refreshUserActivities, 60000);
            }
        });
    </script>
</body>

</html>
