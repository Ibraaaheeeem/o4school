<div th:fragment="promotion-student-list" class="student-table-container">
    <form id="promotionProcessForm" hx-post="/admin/academic/promotion/process" hx-target="#studentListContainer"
        hx-indicator="#loadingIndicator" hx-confirm="Are you sure you want to promote the selected students?">

        <input type="hidden" name="targetSessionId" th:value="${targetSessionId}">
        <input type="hidden" name="targetTermId" th:value="${targetTermId}">

        <div class="px-4 py-3 bg-light border-bottom d-flex justify-content-between align-items-center">
            <h5 class="mb-0">
                Students from <span class="badge bg-primary"
                    th:text="${candidates[0].currentClass.className}">Class</span>
            </h5>
            <div class="d-flex align-items-center gap-3">
                <span class="text-muted small">Targeting: <strong
                        th:text="${targetSession.sessionName + ' - ' + targetTerm.termName}">2025/2026 Term
                        1</strong></span>
                <button type="submit" class="btn btn-success btn-sm px-4">
                    <i class="fas fa-check-circle me-1"></i> Execute Promotion
                </button>
            </div>
        </div>

        <div class="table-responsive">
            <table class="table table-hover mb-0">
                <thead class="table-light">
                    <tr>
                        <th style="width: 40px;">
                            <input type="checkbox" class="form-check-input" checked onchange="toggleAllStudents(this)">
                        </th>
                        <th>Student Name</th>
                        <th>Admission #</th>
                        <th>Current Class</th>
                        <th>Target Class (Recommendation)</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="candidate, iterStat : ${candidates}">
                        <td>
                            <input type="checkbox" name="studentIds" th:value="${candidate.student.id}"
                                class="form-check-input" checked>
                        </td>
                        <td>
                            <div class="d-flex align-items-center gap-2">
                                <img th:if="${candidate.student.passportPhotoUrl}"
                                    th:src="${candidate.student.passportPhotoUrl}"
                                    style="width: 32px; height: 32px; border-radius: 50%; object-fit: cover;">
                                <i th:unless="${candidate.student.passportPhotoUrl}"
                                    class="fas fa-user-circle text-muted" style="font-size: 32px;"></i>
                                <span th:text="${candidate.student.user.fullName}">John Doe</span>
                            </div>
                        </td>
                        <td th:text="${candidate.student.admissionNumber}">ADM-001</td>
                        <td>
                            <span class="badge bg-secondary-subtle text-secondary"
                                th:text="${candidate.currentClass.className}">Current Class</span>
                        </td>
                        <td>
                            <select name="targetClassIds" class="action-select">
                                <option value="">--- Skip ---</option>
                                <option th:each="cls : ${candidate.availableClasses}" th:value="${cls.id}"
                                    th:text="${cls.className}"
                                    th:selected="${candidate.recommendedClass != null && cls.id == candidate.recommendedClass.id}">
                                </option>
                            </select>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </form>
</div>
