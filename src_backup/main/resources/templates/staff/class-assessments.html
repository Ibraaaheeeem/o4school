<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<body>
    <div th:fragment="assessments-content">
        <style>
            .assessments-filter-bar {
                margin-bottom: 1.5rem;
                display: flex;
                flex-wrap: wrap;
                gap: 1rem;
                align-items: center;
                justify-content: space-between;
            }

            .assessment-card {
                background: white;
                border: 1px solid var(--border-color);
                border-radius: var(--radius-lg);
                padding: 1.25rem;
                display: flex;
                gap: 1.25rem;
                align-items: flex-start;
                transition: transform 0.2s, box-shadow 0.2s;
                position: relative;
            }

            .assessment-icon-wrapper {
                background: #fdf2f8;
                color: #db2777;
                width: 48px;
                height: 48px;
                font-size: 1.25rem;
                display: flex;
                align-items: center;
                justify-content: center;
                border-radius: var(--radius-md);
                flex-shrink: 0;
            }

            .assessment-main-info {
                flex: 1;
                min-width: 0;
            }

            .assessment-tags {
                display: flex;
                flex-wrap: wrap;
                gap: 0.5rem;
                margin-bottom: 0.75rem;
            }

            .assessment-meta-grid {
                display: grid;
                grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
                gap: 0.75rem;
                font-size: 0.85rem;
                color: var(--text-muted);
            }

            .assessment-meta-item {
                display: flex;
                align-items: center;
                gap: 0.5rem;
                white-space: nowrap;
                overflow: hidden;
                text-overflow: ellipsis;
            }

            .assessment-actions-group {
                display: flex;
                flex-wrap: wrap;
                gap: 0.5rem;
                margin-top: 1.25rem;
                padding-top: 1rem;
                border-top: 1px solid var(--border-color);
            }

            .assessment-actions-group .action-btn,
            .assessment-actions-group .action-btn-danger {
                padding: 0.5rem 0.75rem;
                font-size: 0.85rem;
                flex: 1;
                justify-content: center;
                min-width: 100px;
            }

            .assessment-actions-group .action-btn-small {
                width: 36px;
                height: 36px;
                flex: 0 0 auto;
                min-width: unset;
                padding: 0;
            }

            @media (max-width: 640px) {
                .assessments-filter-bar {
                    flex-direction: column-reverse;
                    align-items: stretch;
                }

                .action-buttons {
                    display: grid;
                    grid-template-columns: 1fr 1fr;
                    gap: 0.75rem;
                }

                .action-buttons .action-btn {
                    width: 100%;
                    padding: 0.75rem !important;
                }

                .assessment-card {
                    flex-direction: column;
                    gap: 1rem;
                    padding: 1rem;
                }

                .assessment-icon-wrapper {
                    display: none;
                    /* Hide icon on mobile to save vertical space or keep it? user screenshot has it */
                }

                /* Keeping icon but smaller and inline maybe? */
                .assessment-header-mobile {
                    display: flex;
                    align-items: center;
                    gap: 0.75rem;
                    width: 100%;
                }

                .assessment-meta-grid {
                    grid-template-columns: 1fr;
                    gap: 0.5rem;
                }

                .assessment-actions-group {
                    display: grid;
                    grid-template-columns: auto auto 1fr 1fr;
                    gap: 0.5rem;
                    width: 100%;
                }

                .assessment-actions-group .action-btn,
                .assessment-actions-group .action-btn-danger {
                    width: 100%;
                    min-width: unset;
                }

                .assessment-actions-group .action-btn-small {
                    width: 44px;
                    /* Slightly larger for easier touch */
                    height: 44px;
                }
            }
        </style>

        <!-- Filter and Actions Bar -->
        <div class="assessments-filter-bar">
            <!-- Filters Removed -->
            <div style="flex: 1;"></div>

            <div class="action-buttons">
                <a th:href="@{/staff/reports/class(classId=${classId})}" class="action-btn"
                    style="background: white; border: 1px solid var(--border-color); color: var(--text-main); font-weight: 500; display: inline-flex; align-items: center; gap: 0.5rem; transition: all 0.2s ease; border-radius: var(--radius-md);">
                    <i class="fas fa-chart-line"></i> Report
                </a>

                <button class="action-btn"
                    style="background: var(--primary-color); color: white; border: 1px solid var(--primary-color); font-weight: 500; display: inline-flex; align-items: center; gap: 0.5rem; transition: all 0.2s ease; cursor: pointer; border-radius: var(--radius-md);"
                    th:hx-get="@{/staff/classes/{classId}/assessments/new(classId=${classId})}"
                    hx-target="#examinationModal" hx-swap="innerHTML" hx-trigger="click">
                    <i class="fas fa-plus"></i> Create
                </button>
            </div>
        </div>

        <div id="assessments-results">
            <div th:if="${#lists.isEmpty(examinations)}" class="empty-state"
                style="padding: 3rem; text-align: center; color: var(--text-muted); background: var(--bg-body); border-radius: var(--radius-md); border: 1px dashed var(--border-color);">
                <i class="fas fa-clipboard-list" style="font-size: 2rem; margin-bottom: 1rem; opacity: 0.5;"></i>
                <p th:if="${isClassTeacher}" style="margin: 0;">No assessments found matching your filters.</p>
                <p th:unless="${isClassTeacher}" style="margin: 0;">No assessments found for your subjects.</p>
            </div>

            <div class="dashboard-grid" id="examinationsGrid" style="grid-template-columns: 1fr; gap: 1rem;">
                <!-- Loop in the main view, calling the fragment -->
                <th:block th:each="examination : ${examinations}">
                    <div
                        th:replace="~{staff/class-assessments :: assessment-card(examination=${examination}, swapOob='false')}">
                    </div>
                </th:block>
            </div>

            <!-- Pagination Controls -->
            <div th:if="${totalPages > 1}" class="pagination-container">
                <div class="pagination-info">
                    Showing <span th:text="${currentPage * 24 + 1}">1</span> to
                    <span
                        th:text="${(currentPage + 1) * 24 > totalItems ? totalItems : (currentPage + 1) * 24}">24</span>
                    of <span th:text="${totalItems}">0</span> results
                </div>

                <div class="pagination-buttons">
                    <a th:if="${currentPage > 0}"
                        th:href="@{/staff/classes/{classId}/assessments(classId=${classId}, page=${currentPage - 1}, size=24, examType=${paramExamType}, isOnline=${paramIsOnline}, search=${paramSearch}, startDate=${paramStartDate}, endDate=${paramEndDate})}"
                        th:hx-get="@{/staff/classes/{classId}/assessments(classId=${classId}, page=${currentPage - 1}, size=24, examType=${paramExamType}, isOnline=${paramIsOnline}, search=${paramSearch}, startDate=${paramStartDate}, endDate=${paramEndDate})}"
                        hx-target="#assessments-results" hx-select="#assessments-results" hx-swap="outerHTML"
                        class="btn-outline">
                        Previous
                    </a>

                    <span class="page-info">
                        Page <span th:text="${currentPage + 1}">1</span> of <span th:text="${totalPages}">1</span>
                    </span>

                    <a th:if="${currentPage < totalPages - 1}"
                        th:href="@{/staff/classes/{classId}/assessments(classId=${classId}, page=${currentPage + 1}, size=24, examType=${paramExamType}, isOnline=${paramIsOnline}, search=${paramSearch}, startDate=${paramStartDate}, endDate=${paramEndDate})}"
                        th:hx-get="@{/staff/classes/{classId}/assessments(classId=${classId}, page=${currentPage + 1}, size=24, examType=${paramExamType}, isOnline=${paramIsOnline}, search=${paramSearch}, startDate=${paramStartDate}, endDate=${paramEndDate})}"
                        hx-target="#assessments-results" hx-select="#assessments-results" hx-swap="outerHTML"
                        class="btn-outline">
                        Next
                    </a>
                </div>
            </div>
        </div>

    </div> <!-- End of assessments-content -->

    <!-- Reusable Card Content Fragment -->
    <th:block th:fragment="assessment-card-content(examination)">
        <div class="assessment-icon-wrapper">
            <i class="fas fa-file-alt"></i>
        </div>

        <div class="assessment-main-info">
            <div class="assessment-tags">
                <h4 style="margin: 0; font-size: 1.1rem; font-weight: 700; color: var(--text-main); margin-right: 0.5rem;"
                    th:text="${examination.title}">Title</h4>

                <span class="badge" th:classappend="${examination.isPublished ? 'published' : 'draft'}"
                    style="font-size: 0.65rem; padding: 0.2rem 0.6rem; border-radius: 4px; text-transform: uppercase; font-weight: 700; cursor: pointer;"
                    th:styleappend="${examination.isPublished ? 'background: #dcfce7; color: #166534;' : 'background: #fef9c3; color: #854d0e;'}"
                    th:text="${examination.isPublished ? 'Published' : 'Draft'}"
                    th:hx-post="@{/staff/classes/{classId}/examinations/{examId}/toggle-publish(classId=${classId}, examId=${examination.id})}"
                    hx-swap="outerHTML" title="Click to toggle status">Status</span>

                <span class="badge"
                    style="font-size: 0.65rem; padding: 0.2rem 0.6rem; border-radius: 4px; text-transform: uppercase; font-weight: 700;"
                    th:styleappend="${examination.isOnline ? 'background: #e0e7ff; color: #3730a3;' : 'background: #f1f5f9; color: #64748b;'}"
                    th:text="${examination.isOnline ? 'Online' : 'Paper'}">Mode</span>
            </div>

            <div class="assessment-meta-grid">
                <span class="assessment-meta-item" title="Subject">
                    <i class="fas fa-book"></i>
                    <span th:text="${examination.subject.subjectName}">Subject</span>
                </span>
                <span class="assessment-meta-item" title="Exam Type">
                    <i class="fas fa-tag"></i>
                    <span th:text="${examination.examType}">Type</span>
                </span>
                <span class="assessment-meta-item" title="Duration">
                    <i class="fas fa-clock"></i>
                    <span th:text="${examination.durationMinutes + ' mins'}">Duration</span>
                </span>
                <span class="assessment-meta-item" title="Marks">
                    <i class="fas fa-star"></i>
                    <span th:text="${examination.totalMarks + ' marks'}">Marks</span>
                </span>
                <span class="assessment-meta-item" title="Questions">
                    <i class="fas fa-list-ol"></i>
                    <span th:text="${examination.questionCount + ' questions'}">Questions</span>
                </span>
            </div>

            <div class="assessment-actions-group">
                <a th:href="@{/staff/classes/{classId}/examinations/{examId}/questions(classId=${classId},examId=${examination.id})}"
                    class="action-btn"
                    style="background: white; border: 1px solid var(--border-color); color: var(--text-main); font-weight: 500; text-decoration: none; display: inline-flex; align-items: center; justify-content: center; gap: 0.5rem; border-radius: var(--radius-md);"
                    onclick="loadExaminationQuestions(event, this)">
                    <i class="fas fa-list-ol"></i> <span class="btn-text">Questions</span>
                </a>

                <button type="button" class="action-btn"
                    style="background: #eff6ff; border: 1px solid #bfdbfe; color: #1d4ed8; font-weight: 500; cursor: pointer; display: inline-flex; align-items: center; justify-content: center; gap: 0.5rem; border-radius: var(--radius-md);"
                    th:hx-get="@{/staff/classes/{classId}/examinations/{examId}/submissions(classId=${classId},examId=${examination.id})}"
                    hx-target="#examinationModal" hx-trigger="click">
                    <i class="fas fa-file-signature"></i> <span class="btn-text">Submissions</span>
                    <span th:text="'(' + ${examination.submissionCount} + ')'"
                        style="font-weight: 700; background: rgba(255,255,255,0.5); padding: 0 0.4rem; border-radius: 4px; font-size: 0.8rem;">(0)</span>
                </button>

                <a th:href="@{/staff/classes/{classId}/assessments/{examId}/edit(classId=${classId}, examId=${examination.id})}"
                    class="action-btn action-btn-small"
                    style="background: #f0f9ff; color: #0369a1; border: 1px solid #bae6fd; display: flex; align-items: center; justify-content: center;"
                    th:hx-get="@{/staff/classes/{classId}/assessments/{examId}/edit(classId=${classId}, examId=${examination.id})}"
                    hx-target="#examinationModal" hx-trigger="click" title="Edit Examination">
                    <i class="fas fa-edit"></i>
                </a>

                <button type="button" class="action-btn-danger action-btn-small"
                    style="background: #fef2f2; border: 1px solid #fecaca; color: #dc2626; cursor: pointer; display: flex; align-items: center; justify-content: center;"
                    th:hx-delete="@{/staff/classes/{classId}/examinations/{examId}(classId=${classId}, examId=${examination.id})}"
                    th:hx-target="'#examination-card-' + ${examination.id}"
                    hx-confirm="Are you sure you want to delete this examination?" hx-swap="outerHTML"
                    title="Delete Examination">
                    <i class="fas fa-trash"></i>
                </button>
            </div>
        </div>
    </th:block>

    <!-- Reusable Card Shell Fragment -->
    <th:block th:fragment="assessment-card(examination, swapOob)">
        <div class="assessment-card" th:id="'examination-card-' + ${examination.id}"
            th:attr="hx-swap-oob=${swapOob == 'true' ? 'true' : null}">
            <th:block th:replace="~{staff/class-assessments :: assessment-card-content(examination=${examination})}">
            </th:block>
        </div>
    </th:block>
    </div>


    <!-- Examination Modal -->
    <div id="examinationModal" class="modal">
        <!-- Modal content will be loaded here via HTMX -->
    </div>

    <!-- HTMX Response Fragment for Save -->
    <th:block th:fragment="examination-save-response">
        <!-- New Examination Case: Handled by refreshAssessments trigger -->

        <!-- Update Examination Case -->
        <th:block th:unless="${isNew}">
            <div class="assessment-card" th:id="'examination-card-' + ${examination.id}" hx-swap-oob="true">
                <th:block
                    th:replace="~{staff/class-assessments :: assessment-card-content(examination=${examination})}">
                </th:block>
            </div>
        </th:block>
    </th:block>
    </div>
</body>

</html>
