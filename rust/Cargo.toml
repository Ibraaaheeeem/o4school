[package]
name = "school_backend"
version = "0.1.0"
edition = "2021"

[dependencies]
# Web framework
actix-web = "4"
actix-rt = "2"
actix-cors = "0.7"

# Async runtime
tokio = { version = "1", features = ["full"] }

# Database
sqlx = { version = "0.7", features = ["postgres", "runtime-tokio-native-tls", "uuid", "chrono"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Environment variables
dotenv = "0.15"
env_logger = "0.11"

# Logging
log = "0.4"

# UUID
uuid = { version = "1.0", features = ["v4", "serde"] }

# DateTime
chrono = { version = "0.4", features = ["serde"] }

# Error handling
anyhow = "1.0"
thiserror = "1.0"

# JWT authentication
jsonwebtoken = "9.0"

# Password hashing
bcrypt = "0.15"

# Random number generation
rand = "0.8"

# HTTP client
reqwest = { version = "0.11", features = ["json"] }

# Validation
validator = { version = "0.16", features = ["derive"] }

# String utilities (for slug generation)
slug = "0.1"

# Futures utilities
futures-util = "0.3"

[dev-dependencies]
actix-test = "0.1"

[[bin]]
name = "server"
path = "src/main.rs"
