<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>4School - Messaging Dashboard</title>
    <div th:replace="~{fragments/csrf :: csrf-meta}"></div>
    <link rel="stylesheet" th:href="@{/css/common.css}">
    <link rel="stylesheet" th:href="@{/css/dashboard.css}">
    <style>
        .messaging-grid {
            display: grid;
            grid-template-columns: 2fr 1fr;
            gap: 2rem;
            margin-top: 2rem;
        }

        .chat-section,
        .settings-section {
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 2rem;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.3);
        }

        .message-list {
            max-height: 500px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 1rem;
            margin-top: 1.5rem;
            padding-right: 0.5rem;
        }

        .message-bubble {
            max-width: 80%;
            padding: 1rem;
            border-radius: 15px;
            font-size: 0.9rem;
            line-height: 1.4;
        }

        .message-bubble.outgoing {
            align-self: flex-end;
            background: linear-gradient(135deg, #4f46e5 0%, #4338ca 100%);
            color: white;
            border-bottom-right-radius: 2px;
        }

        .message-bubble.incoming {
            align-self: flex-start;
            background: white;
            color: #1e293b;
            border: 1px solid #e2e8f0;
            border-bottom-left-radius: 2px;
        }

        .broadcast-box {
            margin-bottom: 2rem;
        }

        .broadcast-box textarea {
            width: 100%;
            border-radius: 12px;
            padding: 1rem;
            border: 1px solid #e2e8f0;
            margin-bottom: 1rem;
            font-family: inherit;
        }

        .status-pill {
            font-size: 0.7rem;
            padding: 2px 8px;
            border-radius: 50px;
            text-transform: uppercase;
            font-weight: 700;
        }

        .status-sent {
            background: #dcfce7;
            color: #166534;
        }

        .status-failed {
            background: #fee2e2;
            color: #991b1b;
        }
    </style>
</head>

<body>
    <div th:replace="~{fragments/header :: school-header}"></div>

    <main class="main-content">
        <div class="dashboard-container">
            <div class="welcome-section">
                <div class="welcome-text">
                    <h1>Messaging & Notifications</h1>
                    <p>Manage WhatsApp broadcasts and automated reminders for <strong th:text="${school?.name}">School
                            Name</strong></p>
                </div>
            </div>

            <div class="messaging-grid">
                <!-- Main Communication Area -->
                <div class="chat-section">
                    <div class="broadcast-box">
                        <h3>Quick Broadcast</h3>
                        <form th:action="@{/admin/dashboard/messaging/broadcast}" method="post">
                            <select name="recipientType" class="form-control" style="margin-bottom: 1rem; width: 100%;">
                                <option value="ALL_PARENTS">All Parents</option>
                            </select>
                            <textarea name="message" rows="3"
                                placeholder="Type your school-wide announcement here..."></textarea>
                            <button type="submit" class="btn btn-primary">Send WhatsApp Broadcast</button>
                        </form>
                    </div>

                    <h3>Recent Messages</h3>
                    <div class="message-list">
                        <div th:each="msg : ${recentMessages}" class="message-bubble"
                            th:classappend="${msg.direction.name().toLowerCase()}">
                            <div
                                style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 0.5rem;">
                                <strong th:text="${msg.recipientPhone}">Phone</strong>
                                <span class="status-pill" th:classappend="'status-' + ${msg.status.toLowerCase()}"
                                    th:text="${msg.status}">Status</span>
                            </div>
                            <p th:text="${msg.content}">Message Content</p>
                            <small th:text="${#temporals.format(msg.createdAt, 'MMM dd, HH:mm')}"
                                style="opacity: 0.7; display: block; margin-top: 0.5rem;"></small>
                        </div>
                        <div th:if="${#lists.isEmpty(recentMessages)}" class="empty-state">
                            <p>No messages sent yet.</p>
                        </div>
                    </div>
                </div>

                <!-- Settings & Scheduling -->
                <div class="settings-section">
                    <h3>Fee Reminders</h3>
                    <p class="text-secondary small">Automatically send balance alerts to parents with outstanding fees.
                    </p>

                    <form th:action="@{/admin/dashboard/messaging/schedule-reminder}" method="post"
                        style="margin-top: 1.5rem;">
                        <div class="form-group">
                            <label>Frequency</label>
                            <select name="frequency" class="form-control" style="width: 100%; margin-top: 0.5rem;">
                                <option value="DAILY">Daily</option>
                                <option value="WEEKLY">Weekly (Mondays)</option>
                                <option value="MONTHLY">Monthly (1st)</option>
                                <option value="WEEKENDS">Weekends</option>
                            </select>
                        </div>
                        <button type="submit" class="btn btn-outline" style="margin-top: 1rem; width: 100%;">Add
                            Schedule</button>
                    </form>

                    <h4 style="margin-top: 2rem;">Active Schedules</h4>
                    <div th:each="sched : ${schedules}"
                        style="background: white; padding: 1rem; border-radius: 12px; margin-top: 1rem; border: 1px solid #e2e8f0;">
                        <div style="display: flex; justify-content: space-between; align-items: center;">
                            <strong th:text="${sched.frequency}">DAILY</strong>
                            <span class="status-pill status-sent" th:if="${sched.isActive}">Active</span>
                        </div>
                        <small th:if="${sched.lastRunAt}"
                            th:text="'Last run: ' + ${#temporals.format(sched.lastRunAt, 'MMM dd')}"></small>
                    </div>
                </div>
            </div>
        </div>
    </main>
</body>

</html>
