<div class="modal-content">
    <div class="modal-header">
        <h3>Success!</h3>
        <button class="close-modal" onclick="closeModal('studentModal')">&times;</button>
    </div>
    <div class="modal-body" style="text-align: center; padding: 40px 20px;">
        <i class="fas fa-check-circle" style="font-size: 64px; color: #10b981; margin-bottom: 20px;"></i>
        <h4 th:text="${success}">Student saved successfully!</h4>
        <p style="color: #6b7280; margin-top: 10px;">You can close this dialog or add another student.</p>
    </div>
    <div class="modal-footer">
        <button type="button" class="btn btn-outline" onclick="closeModal('studentModal')">Close</button>
        <button type="button" class="btn btn-primary" onclick="location.reload()">Add Another</button>
    </div>
</div>
<div id="global-toast-container" hx-swap-oob="beforeend">
    <div class="toast success show">
        <i class="fas fa-check-circle"></i>
        <span th:text="${success}">Success message</span>
    </div>
</div>
<script th:inline="javascript">
    /*<![CDATA[*/
    setTimeout(() => {
        const toasts = document.querySelectorAll('.toast');
        toasts.forEach(t => t.classList.remove('show'));
    }, 3000);
    /*]]>*/
</script>
