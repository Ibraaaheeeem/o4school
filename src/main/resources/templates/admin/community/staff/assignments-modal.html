<!-- Staff Assignments Modal - Redesigned -->
<div class="modal-content" style="border-radius: 16px; border: none; box-shadow: 0 20px 60px rgba(0,0,0,0.15);">
    <div class="modal-header"
        style="background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; border-radius: 16px 16px 0 0; padding: 1.5rem 2rem; border: none;">
        <div>
            <h5 class="modal-title" style="margin: 0; font-weight: 600; font-size: 1.25rem;">
                <i class="fas fa-chalkboard-teacher me-2"></i>
                Staff Assignments
            </h5>
            <p style="margin: 0.5rem 0 0 0; font-size: 0.9rem; opacity: 0.9;">
                <span th:text="${staff.user.firstName + ' ' + staff.user.lastName}"></span>
                <span style="opacity: 0.7; margin-left: 0.5rem;" th:text="'(' + ${staff.staffId} + ')'"></span>
            </p>
        </div>
        <button type="button" class="btn-close btn-close-white" onclick="closeModal('staffAssignmentModal')"
            aria-label="Close" style="opacity: 0.9;"></button>
    </div>

    <div class="modal-body" style="padding: 2rem; background: #f8f9fa;">
        <!-- Success/Error Messages -->
        <div id="assignment-messages" style="margin-bottom: 1.5rem;">
            <div th:if="${success}" class="alert"
                style="background: #d4edda; border: 1px solid #c3e6cb; color: #155724; border-radius: 12px; padding: 1rem; margin-bottom: 1rem; display: flex; align-items: center;">
                <i class="fas fa-check-circle me-2" style="font-size: 1.2rem;"></i>
                <span th:text="${success}"></span>
            </div>
            <div th:if="${error}" class="alert"
                style="background: #f8d7da; border: 1px solid #f5c6cb; color: #721c24; border-radius: 12px; padding: 1rem; margin-bottom: 1rem; display: flex; align-items: center;">
                <i class="fas fa-exclamation-circle me-2" style="font-size: 1.2rem;"></i>
                <span th:text="${error}"></span>
            </div>
        </div>

        <!-- Academic Session Info Banner -->
        <div
            style="background: white; border-radius: 12px; padding: 1rem; margin-bottom: 1.5rem; border-left: 4px solid #667eea; box-shadow: 0 2px 8px rgba(0,0,0,0.05);">
            <div style="display: flex; align-items: center; gap: 1rem;">
                <i class="fas fa-calendar-alt" style="color: #667eea; font-size: 1.5rem;"></i>
                <div>
                    <div style="font-size: 0.85rem; color: #6c757d; margin-bottom: 0.25rem;">Current Academic Period
                    </div>
                    <div style="font-weight: 600; color: #2d3748;">
                        <span th:text="${currentSession.sessionName}"></span>
                        <span style="color: #cbd5e0; margin: 0 0.5rem;">•</span>
                        <span th:text="${currentTerm.termName}"></span>
                    </div>
                </div>
            </div>
        </div>

        <div class="row g-3">
            <!-- Class Teacher Assignment -->
            <div class="col-lg-6">
                <div
                    style="background: white; border-radius: 12px; padding: 1.5rem; height: 100%; box-shadow: 0 2px 8px rgba(0,0,0,0.05);">
                    <div
                        style="display: flex; align-items: center; gap: 0.75rem; margin-bottom: 1.25rem; padding-bottom: 1rem; border-bottom: 2px solid #f1f3f5;">
                        <div
                            style="width: 40px; height: 40px; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); border-radius: 10px; display: flex; align-items: center; justify-content: center;">
                            <i class="fas fa-users" style="color: white; font-size: 1.1rem;"></i>
                        </div>
                        <div>
                            <h6 style="margin: 0; font-weight: 600; color: #2d3748;">Class Teacher</h6>
                            <small style="color: #718096;">Assign as homeroom teacher</small>
                        </div>
                    </div>

                    <form id="classTeacherForm"
                        th:hx-post="@{/admin/community/staff/{staffId}/assign-class-htmx(staffId=${staff.id})}"
                        hx-target="#staffAssignmentModal .modal-dialog" hx-swap="innerHTML"
                        th:attr="hx-headers='{&quot;X-CSRF-TOKEN&quot;: &quot;' + ${_csrf.token} + '&quot;}'"
                        action="javascript:void(0);">
                        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />

                        <div class="mb-3">
                            <label for="classTeacherTrackId"
                                style="font-weight: 500; color: #4a5568; font-size: 0.9rem; margin-bottom: 0.5rem; display: block;">
                                <i class="fas fa-route me-1" style="color: #a0aec0;"></i>Track
                            </label>
                            <select class="form-select" id="classTeacherTrackId"
                                onchange="loadAssignmentClassesByTrack('classTeacher')"
                                style="border-radius: 8px; border: 1px solid #e2e8f0; padding: 0.6rem 0.75rem;">
                                <option value="">Choose a track...</option>
                                <option th:each="track : ${tracks}" th:value="${track.id}" th:text="${track.name}">
                                </option>
                            </select>
                        </div>

                        <div class="mb-3">
                            <label for="classTeacherClassId"
                                style="font-weight: 500; color: #4a5568; font-size: 0.9rem; margin-bottom: 0.5rem; display: block;">
                                <i class="fas fa-school me-1" style="color: #a0aec0;"></i>Class
                            </label>
                            <select class="form-select" id="classTeacherClassId" name="assignedClassId" disabled
                                style="border-radius: 8px; border: 1px solid #e2e8f0; padding: 0.6rem 0.75rem;">
                                <option value="">First select a track...</option>
                            </select>
                        </div>

                        <button type="submit" class="btn w-100"
                            style="background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; border: none; border-radius: 8px; padding: 0.7rem; font-weight: 500; transition: transform 0.2s; margin-top: 0.5rem;">
                            <i class="fas fa-plus me-2"></i>Assign as Class Teacher
                        </button>
                    </form>

                    <!-- Current Class Assignments -->
                    <div id="current-class-assignments" th:if="${!#lists.isEmpty(currentClassAssignments)}"
                        style="margin-top: 1.5rem; padding-top: 1.5rem; border-top: 1px solid #e2e8f0;">
                        <div
                            style="font-size: 0.85rem; font-weight: 600; color: #718096; text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 0.75rem;">
                            Current Assignments</div>
                        <div th:each="assignment : ${currentClassAssignments}"
                            style="background: #f7fafc; border-radius: 8px; padding: 0.75rem; margin-bottom: 0.5rem; display: flex; justify-content: space-between; align-items: center;">
                            <div style="flex: 1;">
                                <div style="font-weight: 500; color: #2d3748; margin-bottom: 0.25rem;"
                                    th:text="${(assignment.schoolClass.track != null ? assignment.schoolClass.track.name : 'No Track') + ' - ' + assignment.schoolClass.className}">
                                </div>
                                <small style="color: #718096; font-size: 0.8rem;"
                                    th:text="${assignment.academicSession.sessionName + ' • ' + assignment.term.termName}"></small>
                            </div>
                            <button type="button" th:data-assignment-id="${assignment.id}"
                                th:data-assignment-info="${(assignment.schoolClass.track != null ? assignment.schoolClass.track.name : 'No Track') + ' - ' + assignment.schoolClass.className}"
                                onclick="removeClassAssignment(this.dataset.assignmentId, this.dataset.assignmentInfo)"
                                style="background: #fed7d7; color: #c53030; border: none; border-radius: 6px; padding: 0.4rem 0.6rem; cursor: pointer; transition: all 0.2s;"
                                onmouseover="this.style.background='#fc8181'"
                                onmouseout="this.style.background='#fed7d7'">
                                <i class="fas fa-times"></i>
                            </button>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Subject Teacher Assignment -->
            <div class="col-lg-6">
                <div
                    style="background: white; border-radius: 12px; padding: 1.5rem; height: 100%; box-shadow: 0 2px 8px rgba(0,0,0,0.05);">
                    <div
                        style="display: flex; align-items: center; gap: 0.75rem; margin-bottom: 1.25rem; padding-bottom: 1rem; border-bottom: 2px solid #f1f3f5;">
                        <div
                            style="width: 40px; height: 40px; background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%); border-radius: 10px; display: flex; align-items: center; justify-content: center;">
                            <i class="fas fa-book" style="color: white; font-size: 1.1rem;"></i>
                        </div>
                        <div>
                            <h6 style="margin: 0; font-weight: 600; color: #2d3748;">Subject Teacher</h6>
                            <small style="color: #718096;">Assign to teach a subject</small>
                        </div>
                    </div>

                    <form id="subjectTeacherForm"
                        th:hx-post="@{/admin/community/staff/{staffId}/assign-subject-htmx(staffId=${staff.id})}"
                        hx-target="#staffAssignmentModal .modal-dialog" hx-swap="innerHTML"
                        th:attr="hx-headers='{&quot;X-CSRF-TOKEN&quot;: &quot;' + ${_csrf.token} + '&quot;}'"
                        action="javascript:void(0);">
                        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />

                        <div class="mb-3">
                            <label for="subjectTeacherTrackId"
                                style="font-weight: 500; color: #4a5568; font-size: 0.9rem; margin-bottom: 0.5rem; display: block;">
                                <i class="fas fa-route me-1" style="color: #a0aec0;"></i>Track
                            </label>
                            <select class="form-select" id="subjectTeacherTrackId"
                                onchange="loadAssignmentClassesByTrack('subjectTeacher')"
                                style="border-radius: 8px; border: 1px solid #e2e8f0; padding: 0.6rem 0.75rem;">
                                <option value="">Choose a track...</option>
                                <option th:each="track : ${tracks}" th:value="${track.id}" th:text="${track.name}">
                                </option>
                            </select>
                        </div>

                        <div class="mb-3">
                            <label for="subjectTeacherClassId"
                                style="font-weight: 500; color: #4a5568; font-size: 0.9rem; margin-bottom: 0.5rem; display: block;">
                                <i class="fas fa-school me-1" style="color: #a0aec0;"></i>Class
                            </label>
                            <select class="form-select" id="subjectTeacherClassId" name="assignedClassId"
                                onchange="loadAssignmentSubjectsByClass()" disabled
                                style="border-radius: 8px; border: 1px solid #e2e8f0; padding: 0.6rem 0.75rem;">
                                <option value="">First select a track...</option>
                            </select>
                        </div>

                        <div class="mb-3">
                            <label for="subjectId"
                                style="font-weight: 500; color: #4a5568; font-size: 0.9rem; margin-bottom: 0.5rem; display: block;">
                                <i class="fas fa-book me-1" style="color: #a0aec0;"></i>Subject
                            </label>
                            <select class="form-select" id="subjectId" name="subjectId" required disabled
                                style="border-radius: 8px; border: 1px solid #e2e8f0; padding: 0.6rem 0.75rem;">
                                <option value="">First select a class...</option>
                            </select>
                        </div>

                        <button type="submit" class="btn w-100"
                            style="background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%); color: white; border: none; border-radius: 8px; padding: 0.7rem; font-weight: 500; transition: transform 0.2s; margin-top: 0.5rem;">
                            <i class="fas fa-plus me-2"></i>Assign as Subject Teacher
                        </button>
                    </form>

                    <!-- Current Subject Assignments -->
                    <div id="current-subject-assignments" th:if="${!#lists.isEmpty(currentSubjectAssignments)}"
                        style="margin-top: 1.5rem; padding-top: 1.5rem; border-top: 1px solid #e2e8f0;">
                        <div
                            style="font-size: 0.85rem; font-weight: 600; color: #718096; text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 0.75rem;">
                            Current Assignments</div>
                        <div th:each="assignment : ${currentSubjectAssignments}"
                            style="background: #f7fafc; border-radius: 8px; padding: 0.75rem; margin-bottom: 0.5rem; display: flex; justify-content: space-between; align-items: center;">
                            <div style="flex: 1;">
                                <div style="font-weight: 500; color: #2d3748; margin-bottom: 0.25rem;"
                                    th:text="${assignment.subject.subjectName}"></div>
                                <small style="color: #718096; font-size: 0.8rem;"
                                    th:text="${(assignment.schoolClass.track != null ? assignment.schoolClass.track.name : 'No Track') + ' - ' + assignment.schoolClass.className}"></small>
                                <br>
                                <small style="color: #a0aec0; font-size: 0.75rem;"
                                    th:text="${assignment.academicSession.sessionName + ' • ' + assignment.term.termName}"></small>
                            </div>
                            <button type="button" th:data-assignment-id="${assignment.id}"
                                th:data-assignment-info="${assignment.subject.subjectName + ' in ' + (assignment.schoolClass.track != null ? assignment.schoolClass.track.name : 'No Track') + ' - ' + assignment.schoolClass.className}"
                                onclick="removeSubjectAssignment(this.dataset.assignmentId, this.dataset.assignmentInfo)"
                                style="background: #fed7d7; color: #c53030; border: none; border-radius: 6px; padding: 0.4rem 0.6rem; cursor: pointer; transition: all 0.2s;"
                                onmouseover="this.style.background='#fc8181'"
                                onmouseout="this.style.background='#fed7d7'">
                                <i class="fas fa-times"></i>
                            </button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div class="modal-footer"
        style="background: #f8f9fa; border-top: 1px solid #e2e8f0; border-radius: 0 0 16px 16px; padding: 1.25rem 2rem;">
        <button type="button" class="btn" onclick="closeModal('staffAssignmentModal')"
            style="background: #e2e8f0; color: #4a5568; border: none; border-radius: 8px; padding: 0.6rem 1.5rem; font-weight: 500;">
            <i class="fas fa-times me-2"></i>Close
        </button>
    </div>
</div>


<!-- OOB Update for Staff Card (only included when isOob is true) -->
<th:block th:if="${isOob}">
    <div th:replace="~{admin/community/staff/staff-card-single :: single-staff-card}"></div>
</th:block>
