# Secure File Upload Settings

# Virtual Threads (Java 21+)
spring.threads.virtual.enabled=true

# PostgreSQL Configuration
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/myschool}
spring.datasource.username=${DB_USERNAME:abuhaneefayn}
spring.datasource.password=${DB_PASSWORD:pass}
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=validate

# Flyway Configuration
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migration
spring.flyway.validate-on-migrate=true
spring.flyway.ignore-missing-migrations=true

# Disable runtime bytecode provider (essential for Native)
spring.jpa.properties.hibernate.bytecode.provider=none

# Optional: Improve startup by disabling dynamic metadata lookups
spring.jpa.properties.hibernate.temp.use_jdbc_metadata_defaults=false

# If you still see the error, force Jakarta-based scanning
spring.jpa.properties.hibernate.bytecode.reflection_optimizer=true
# H2 Database configuration (commented out)
# spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1
# spring.datasource.driverClassName=org.h2.Driver
# spring.datasource.username=sa
# spring.datasource.password=password
# spring.h2.console.enabled=true
# spring.h2.console.path=/h2-console
# spring.h2.console.settings.web-allow-others=true
# spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
# spring.jpa.hibernate.ddl-auto=create-drop
spring.thymeleaf.cache=false

# Hibernate Properties
spring.jpa.properties.hibernate.default_batch_fetch_size=50

# JWT Configuration
jwt.secret=${JWT_SECRET:}
jwt.expiration=${JWT_EXPIRATION:86400000}


# File Upload Configuration
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=10MB
spring.servlet.multipart.enabled=true
spring.servlet.multipart.file-size-threshold=0
app.upload.dir=${APP_UPLOAD_DIR:uploads}
app.upload.max-file-size=${APP_UPLOAD_MAX_SIZE:5242880}

# Tomcat configuration to fix FileCountLimitExceededException
server.tomcat.connection-timeout=60000
server.tomcat.max-http-form-post-size=10MB
server.tomcat.max-parameter-count=10000
server.forward-headers-strategy=framework
server.tomcat.remoteip.remote-ip-header=x-forwarded-for
server.tomcat.remoteip.protocol-header=x-forwarded-proto
server.tomcat.remoteip.host-header=x-forwarded-host

# Paystack Configuration
paystack.secret.key=${PAYSTACK_SECRET_KEY:}
paystack.public.key=${PAYSTACK_PUBLIC_KEY:}
paystack.api.url=${PAYSTACK_API_URL:https://api.paystack.co}

# Squad Configuration
squad.secret.key=${SQUAD_SECRET_KEY:}
squad.api.url=${SQUAD_API_URL:https://sandbox-api-d.squadco.com}
squad.beneficiary.account=${SQUAD_BENEFICIARY_ACCOUNT:}
squad.public.key=${SQUAD_PUBLIC_KEY:}

# HostAfrica Configuration
hostafrica.api.url=${HOSTAFRICA_API_URL:https://my.hostafrica.com/modules/addons/DomainsReseller/api/index.php}
hostafrica.api.username=${HOSTAFRICA_API_USERNAME:}
hostafrica.api.token=${HOSTAFRICA_API_TOKEN:}

management.endpoints.web.exposure.include=health,prometheus
management.endpoint.health.show-details=when_authorized

# Email Configuration (Zoho SMTP)
spring.mail.host=${SMTP_SERVER:smtp.zoho.com}
spring.mail.port=${SMTP_PORT:587}
spring.mail.username=${SMTP_USERNAME:}
spring.mail.password=${SMTP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.from=${SENDER_EMAIL:admin@4school.app}

# External Content Database (Elearner)
# Elearner Datasource
elearner.datasource.url=${ELEARNER_DB_URL:jdbc:postgresql://localhost:5432/elearner}
elearner.datasource.username=${ELEARNER_DB_USERNAME:abuhaneefayn}
elearner.datasource.password=${ELEARNER_DB_PASSWORD:pass}
elearner.datasource.driver-class-name=org.postgresql.Driver

google.gemini.api.key=${GEMINI_API_KEY:}
# AI Provider: gemini or deepseek
ai.provider=${AI_PROVIDER:deepseek}

# DeepSeek Configuration
deepseek.api.key=${DEEPSEEK_API_KEY:}
deepseek.model=${DEEPSEEK_MODEL:deepseek-reasoner}

spring.ai.google.genai.api-key=${GEMINI_API_KEY:}
# Remove project-id and location if using AI Studio API Key (AIza...)
# spring.ai.google.genai.project-id=gen-lang-client-0029789253
# spring.ai.google.genai.location=us-central1
spring.ai.google.genai.chat.options.model=${GEMINI_MODEL:gemini-1.5-flash}
spring.flyway.enabled=false

