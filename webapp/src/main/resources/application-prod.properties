# Production profile configuration

# Disable debug logging in production
logging.level.com.haneef._school=INFO
logging.level.org.springframework.security=WARN
logging.level.org.springframework.security.web.access=WARN
logging.level.org.springframework.security.access=WARN
logging.level.org.springframework.web=INFO
logging.level.org.hibernate.SQL=WARN

# Disable DevTools in production
spring.devtools.restart.enabled=false
spring.devtools.livereload.enabled=false

# Enable template caching for performance
spring.thymeleaf.cache=true

# Actuator - restrict exposed endpoints in production
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never
management.info.env.enabled=false
management.info.java.enabled=false
management.info.os.enabled=false

# JPA/Hibernate optimizations
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.batch_size=50
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true

# HikariCP connection pool tuning
# 20 connections balances throughput with resource usage on a typical single-CPU deployment
spring.datasource.hikari.maximum-pool-size=20
