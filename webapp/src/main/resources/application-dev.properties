# Development profile configuration

# DevTools configuration for auto-restart
spring.devtools.restart.enabled=true
spring.devtools.livereload.enabled=true
spring.devtools.restart.additional-paths=src/main/resources
spring.devtools.restart.exclude=static/**,public/**

# Development Hot Reload Optimization
# Use file: prefix locally for instant updates
spring.thymeleaf.prefix=${DEV_THYMELEAF_PREFIX:classpath:/templates/}
spring.web.resources.static-locations=${DEV_STATIC_LOCATIONS:classpath:/static/}
spring.thymeleaf.cache=false

# Debug logging for development
logging.level.com.haneef._school=DEBUG
logging.level.org.springframework.security=DEBUG
logging.level.org.springframework.security.web.access=DEBUG
logging.level.org.springframework.security.access=DEBUG

# PostgreSQL Configuration
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/myschool}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:password}
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=validate

# Elearner Database Configuration
elearner.datasource.url=${ELEARNER_DB_URL:jdbc:postgresql://localhost:5432/elearner}
elearner.datasource.username=${ELEARNER_DB_USERNAME:postgres}
elearner.datasource.password=${ELEARNER_DB_PASSWORD:password}
elearner.datasource.driver-class-name=org.postgresql.Driver

ai.provider=${AI_PROVIDER:deepseek}

# DeepSeek Configuration
deepseek.api.key=${DEEPSEEK_API_KEY:}
deepseek.model=${DEEPSEEK_MODEL:deepseek-reasoner}


# Termii SMS Configuration
termii.api.key=${TERMII_API_KEY:TLFvqIOBqeAvvUEwcGcjnzPYQBondzWJWNkHnYEPztxjHqbEFxjBZijqzSZTBs}
termii.api.url=${TERMII_API_URL:https://v3.api.termii.com}
termii.sender.id=${TERMII_SENDER_ID:o4School}
termii.channel=${TERMII_CHANNEL:generic}
