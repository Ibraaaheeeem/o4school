<th:block th:fragment="questions-management-content">
    <style>
        /* Scoped styles for question management */
        .question-card-wrapper {
            position: relative;
            transition: all 0.3s ease;
            border-radius: 18px;
        }

        .question-number {
            font-size: 1.1rem;
            font-weight: 700;
            color: var(--primary-color);
        }

        .options-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1rem;
            margin-top: 1rem;
        }

        .option-item {
            padding: 0.75rem 1rem;
            background: var(--bg-body);
            border-radius: var(--radius-md);
            border: 1px solid var(--border-color);
            display: flex;
            gap: 0.75rem;
            font-size: 0.95rem;
        }

        .option-label {
            font-weight: 700;
            color: var(--primary-color);
            flex-shrink: 0;
        }

        .quill-editor {
            background: white;
            border-radius: 0 0 var(--radius-md) var(--radius-md);
            border-color: var(--border-color) !important;
            min-height: 100px;
        }

        .quill-editor.minimal {
            min-height: 60px;
        }

        .ql-toolbar {
            border-radius: var(--radius-md) var(--radius-md) 0 0;
            border-color: var(--border-color) !important;
            background: var(--bg-body);
        }

        .ql-container {
            border-radius: 0 0 var(--radius-md) var(--radius-md);
            border-color: var(--border-color) !important;
            font-family: 'Inter', sans-serif !important;
            font-size: 1rem !important;
        }

        /* Modal Overrides */
        .custom-modal {
            display: none;
            position: fixed;
            z-index: 1000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(4px);
            overflow-y: auto;
            align-items: center;
            justify-content: center;
        }

        .custom-modal.active {
            display: flex;
        }

        .custom-modal-content {
            background-color: var(--bg-card);
            margin: 2rem auto;
            padding: 2rem;
            border-radius: var(--radius-lg);
            width: 90%;
            max-width: 800px;
            box-shadow: var(--shadow-lg);
            position: relative;
            max-height: 90vh;
            overflow-y: auto;
        }

        @media (max-width: 768px) {
            .options-grid {
                grid-template-columns: 1fr;
            }
        }

        .option-cell {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
            min-width: 0;
            /* Prevent grid blowout */
            position: relative;
        }

        .option-cell .quill-editor {
            flex-grow: 1;
        }

        /* Assessment Meta Info Grid */
        .meta-info-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 1rem;
            margin-bottom: 2rem;
        }

        .meta-stat-card {
            background: white;
            border: 1px solid var(--border-color);
            border-radius: var(--radius-lg);
            padding: 1rem 1.25rem;
            display: flex;
            align-items: center;
            gap: 1rem;
            box-shadow: var(--shadow-sm);
        }

        .meta-icon-box {
            width: 40px;
            height: 40px;
            border-radius: var(--radius-md);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.1rem;
            flex-shrink: 0;
        }

        .meta-content .label {
            display: block;
            font-size: 0.75rem;
            color: var(--text-muted);
            text-transform: uppercase;
            font-weight: 700;
            letter-spacing: 0.025em;
            margin-bottom: 0.125rem;
        }

        .meta-content .value {
            font-size: 1rem;
            font-weight: 600;
            color: var(--text-main);
        }

        /* AI Modal Specific Layout */
        .topic-row {
            display: flex;
            gap: 0.75rem;
            margin-bottom: 1rem;
            align-items: flex-end;
        }

        .topic-name-group {
            flex: 3;
        }

        .topic-inner-group {
            display: flex;
            gap: 0.75rem;
            align-items: flex-end;
            flex: 1.5;
        }

        .topic-count-wrapper {
            flex: 1;
        }

        .ai-topic-input,
        .ai-topic-count {
            width: 100%;
            padding: 0.75rem;
            border: 1px solid var(--border-color);
            border-radius: var(--radius-md);
            font-size: 0.95rem;
            background: white;
        }

        .modal-footer {
            margin-top: 1.5rem;
            padding-top: 1.5rem;
            border-top: 1px solid var(--border-color);
            display: flex;
            justify-content: flex-end;
            gap: 1rem;
        }

        @media (max-width: 640px) {
            .questions-management {
                padding: 1rem !important;
            }

            .section-header {
                flex-direction: column;
                align-items: stretch;
                gap: 1.25rem;
                margin-bottom: 1.5rem !important;
            }

            .section-header .btn-outline {
                width: 100%;
                justify-content: center;
            }

            .meta-info-grid {
                grid-template-columns: 1fr;
                gap: 0.75rem;
            }

            .meta-stat-card {
                padding: 0.875rem;
            }

            .meta-icon-box {
                width: 32px;
                height: 32px;
                font-size: 1rem;
            }

            .meta-content .value {
                font-size: 0.9375rem;
            }

            .questions-form-header {
                flex-direction: column;
                align-items: stretch;
                gap: 1rem;
            }

            .action-buttons-group {
                display: grid;
                grid-template-columns: 1fr 1fr;
                gap: 0.5rem;
                width: 100%;
            }

            .action-buttons-group .btn {
                padding: 0.875rem 0.5rem;
                font-size: 0.875rem;
                white-space: nowrap;
                justify-content: center;
                width: 100%;
                border-radius: var(--radius-md);
                font-weight: 600;
            }

            .question-card-header {
                flex-direction: column;
                gap: 1rem;
                align-items: flex-start;
            }

            .question-card-header .btn-group {
                width: 100%;
            }

            .question-card-header .action-btn {
                flex: 1;
                justify-content: center;
            }

            .topic-row {
                flex-direction: column;
                align-items: stretch;
                gap: 0.75rem;
            }

            .topic-name-group,
            .topic-inner-group {
                flex: none;
                width: 100%;
            }

            .modal-footer {
                flex-direction: column-reverse;
            }

            .modal-footer button {
                width: 100%;
            }
        }
    </style>

    <div class="questions-management" style="padding: 1.5rem;">
        <!-- Header -->
        <div class="section-header" style="margin-bottom: 2rem;">
            <div>
                <h2 class="section-title">Manage Questions</h2>
                <p style="color: var(--text-muted); margin-top: 0.25rem;">Add, edit, or remove questions for this
                    assessment.</p>
            </div>
            <button type="button" class="btn btn-outline" onclick="goBackToAssessments()">
                <i class="fas fa-arrow-left"></i> Back to Assessments
            </button>
        </div>

        <!-- Meta Info Grid -->
        <div class="meta-info-grid">
            <div class="meta-stat-card">
                <div class="meta-icon-box" style="background: #eff6ff; color: #3b82f6;">
                    <i class="fas fa-file-alt"></i>
                </div>
                <div class="meta-content">
                    <span class="label">Examination</span>
                    <span class="value" th:text="${examination.title}">Title</span>
                </div>
            </div>
            <div class="meta-stat-card">
                <div class="meta-icon-box" style="background: #f0fdf4; color: #22c55e;">
                    <i class="fas fa-book"></i>
                </div>
                <div class="meta-content">
                    <span class="label">Subject</span>
                    <span class="value" th:text="${examination.subject.subjectName}">Subject</span>
                </div>
            </div>
            <div class="meta-stat-card">
                <div class="meta-icon-box" style="background: #fff7ed; color: #f97316;">
                    <i class="fas fa-star"></i>
                </div>
                <div class="meta-content">
                    <span class="label">Total Marks</span>
                    <span class="value" th:text="${examination.totalMarks}">100</span>
                </div>
            </div>
        </div>

        <!-- Existing Questions -->
        <div id="existingQuestionsList"
            style="display: flex; flex-direction: column; gap: 1.5rem; margin-bottom: 3rem;">
            <div class="question-card-header"
                style="display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border-color); padding-bottom: 1rem;">
                <h3 class="section-title" style="font-size: 1.25rem; margin: 0;">Existing Questions</h3>
                <span class="badge" style="background: var(--bg-hover); color: var(--text-muted);"
                    th:text="${#lists.size(examination.questions)} + ' Questions'">0 Questions</span>
            </div>

            <div th:if="${#lists.isEmpty(examination.questions)}" id="noQuestionsMessage" class="empty-state"
                style="padding: 3rem; text-align: center; background: var(--bg-body); border-radius: var(--radius-lg); border: 1px dashed var(--border-color);">
                <i class="fas fa-clipboard-question"
                    style="font-size: 3rem; color: var(--text-light); margin-bottom: 1rem;"></i>
                <p style="color: var(--text-muted);">No questions added yet.</p>
            </div>

            <div th:each="question, iter : ${examination.questions}" class="dashboard-card question-card-wrapper"
                th:id="'question-' + ${question.id}" style="padding: 1.5rem;">
                <div class="question-card-header"
                    style="display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 1.5rem; border-bottom: 1px solid var(--border-color); padding-bottom: 1rem;">
                    <span class="question-number" th:text="'Question ' + (${iter.index} + 1)">Question 1</span>
                    <div class="btn-group" style="display: flex; gap: 0.5rem;">
                        <button type="button" class="action-btn"
                            style="background: #fff7ed; color: #ea580c; padding: 0.5rem; border-radius: 6px; border: 1px solid #ffedd5;"
                            th:data-id="${question.id}" onclick="editQuestion(this.getAttribute('data-id'))"
                            title="Edit">
                            <i class="fas fa-pencil-alt"></i>
                        </button>
                        <button type="button" class="action-btn"
                            style="background: #fef2f2; color: #dc2626; padding: 0.5rem; border-radius: 6px; border: 1px solid #fee2e2;"
                            th:data-id="${question.id}" onclick="deleteQuestion(this.getAttribute('data-id'))"
                            title="Delete">
                            <i class="fas fa-trash-alt"></i>
                        </button>
                    </div>
                </div>

                <div class="question-content">
                    <div th:if="${question.instruction}" th:utext="${question.instruction}"
                        style="font-style: italic; color: var(--text-muted); margin-bottom: 1rem; padding: 0.75rem; background: var(--bg-body); border-left: 3px solid var(--info-color); border-radius: 4px;">
                    </div>

                    <div th:if="${question.explanation}"
                        style="margin-bottom: 1rem; padding: 0.75rem; background: #eff6ff; border-radius: 4px; border: 1px solid #bfdbfe;">
                        <strong
                            style="display: block; color: #1e40af; margin-bottom: 0.25rem; font-size: 0.9rem;">Explanation:</strong>
                        <div th:utext="${question.explanation}" style="color: #1e3a8a; font-size: 0.95rem;"></div>
                    </div>

                    <div class="question-text" th:utext="${question.questionText}"
                        style="font-size: 1.1rem; color: var(--text-main); margin-bottom: 1.5rem; line-height: 1.6;">
                    </div>

                    <div class="options-grid">
                        <div class="option-item"
                            th:classappend="${question.correctAnswer == 'A'} ? 'correct-option' : ''"
                            th:style="${question.correctAnswer == 'A'} ? 'border-color: var(--success-color); background: #f0fdf4;' : ''">
                            <span class="option-label">A</span>
                            <span th:utext="${question.optionA}"></span>
                        </div>
                        <div class="option-item"
                            th:classappend="${question.correctAnswer == 'B'} ? 'correct-option' : ''"
                            th:style="${question.correctAnswer == 'B'} ? 'border-color: var(--success-color); background: #f0fdf4;' : ''">
                            <span class="option-label">B</span>
                            <span th:utext="${question.optionB}"></span>
                        </div>
                        <div class="option-item" th:if="${question.optionC}"
                            th:classappend="${question.correctAnswer == 'C'} ? 'correct-option' : ''"
                            th:style="${question.correctAnswer == 'C'} ? 'border-color: var(--success-color); background: #f0fdf4;' : ''">
                            <span class="option-label">C</span>
                            <span th:utext="${question.optionC}"></span>
                        </div>
                        <div class="option-item" th:if="${question.optionD}"
                            th:classappend="${question.correctAnswer == 'D'} ? 'correct-option' : ''"
                            th:style="${question.correctAnswer == 'D'} ? 'border-color: var(--success-color); background: #f0fdf4;' : ''">
                            <span class="option-label">D</span>
                            <span th:utext="${question.optionD}"></span>
                        </div>
                        <div class="option-item" th:if="${question.optionE}"
                            th:classappend="${question.correctAnswer == 'E'} ? 'correct-option' : ''"
                            th:style="${question.correctAnswer == 'E'} ? 'border-color: var(--success-color); background: #f0fdf4;' : ''">
                            <span class="option-label">E</span>
                            <span th:utext="${question.optionE}"></span>
                        </div>
                    </div>

                    <div style="margin-top: 1.5rem; display: flex; gap: 1rem; align-items: center;">
                        <span class="badge"
                            style="background: var(--success-color); color: white; padding: 0.25rem 0.75rem; border-radius: 999px; font-size: 0.85rem;">
                            Correct: <span th:text="${question.correctAnswer}">A</span>
                        </span>
                        <span class="badge"
                            style="background: var(--text-main); color: white; padding: 0.25rem 0.75rem; border-radius: 999px; font-size: 0.85rem;">
                            <span th:text="${question.marks}">5</span> Marks
                        </span>
                    </div>
                </div>
            </div>
        </div>

        <!-- Add New Questions Form -->
        <form id="questionsForm" method="POST" class="content-panel"
            style="border-top: 4px solid var(--primary-color); border-radius: var(--radius-lg); background: white;">
            <div class="questions-form-header"
                style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 2rem;">
                <h3 class="section-title" style="font-size: 1.25rem; margin: 0;">Add New Questions</h3>
                <div class="action-buttons-group">
                    <button type="button" class="btn"
                        style="background: #fff1f2; color: #e11d48; border: 1px solid #fecdd3; display: flex; align-items: center; gap: 0.625rem; transition: all 0.2s; box-shadow: 0 1px 2px rgba(0,0,0,0.05);"
                        onclick="showAiModal()" onmouseover="this.style.background='#ffe4e6'"
                        onmouseout="this.style.background='#fff1f2'">
                        <i class="fas fa-magic" style="font-size: 0.9em;"></i> Generate with AI
                    </button>
                    <button type="button" class="btn"
                        style="background: #f0f9ff; color: #0369a1; border: 1px solid #bae6fd; display: flex; align-items: center; gap: 0.625rem; transition: all 0.2s; box-shadow: 0 1px 2px rgba(0,0,0,0.05);"
                        onclick="addQuestion()" onmouseover="this.style.background='#e0f2fe'"
                        onmouseout="this.style.background='#f0f9ff'">
                        <i class="fas fa-plus-circle" style="font-size: 0.9em;"></i> Add Question Card
                    </button>
                </div>
            </div>

            <div id="newQuestionsList" style="display: flex; flex-direction: column; gap: 2rem;">
                <!-- New questions appended here -->
            </div>

            <div class="form-actions"
                style="margin-top: 2rem; padding-top: 2rem; border-top: 1px solid var(--border-color); display: flex; justify-content: flex-end;">
                <button type="submit" class="action-btn" id="saveQuestionsBtn"
                    style="background: var(--primary-color); color: white; padding: 0.875rem 2rem; font-size: 1rem; width: auto; font-weight: 600; box-shadow: var(--shadow-md);">
                    <i class="fas fa-save"></i> Save All New Questions
                </button>
            </div>
        </form>

        <!-- Templates and Modals -->
        <template id="questionTemplate">
            <div class="dashboard-card question-card" data-index="__INDEX__"
                style="padding: 1.5rem; border: 1px solid var(--primary-color); box-shadow: 0 4px 6px -1px rgba(79, 70, 229, 0.1);">
                <div class="question-card-header"
                    style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.5rem;">
                    <span class="question-number">New Question __NUMBER__</span>
                    <button type="button" class="btn btn-sm"
                        style="color: var(--danger-color); background: white; border: 1px solid var(--danger-color); display: flex; align-items: center; gap: 0.5rem; padding: 0.5rem 1rem;"
                        onclick="removeQuestion(this)">
                        <i class="fas fa-trash-alt"></i> Remove
                    </button>
                </div>

                <div style="margin-bottom: 1.5rem;">
                    <label
                        style="display: block; font-weight: 600; margin-bottom: 0.5rem; color: var(--text-main);">Instruction
                        (Optional)</label>
                    <div class="quill-editor minimal" data-placeholder="e.g., Read the passage..."></div>
                    <input type="hidden" name="questions[__INDEX__].instruction">
                </div>



                <div style="margin-bottom: 1.5rem;">
                    <label
                        style="display: block; font-weight: 600; margin-bottom: 0.5rem; color: var(--text-main);">Question
                        Text <span style="color: var(--danger-color);">*</span></label>
                    <div class="quill-editor" data-placeholder="Type your question here..."></div>
                    <input type="hidden" name="questions[__INDEX__].questionText" required>
                </div>

                <div class="options-grid">
                    <div class="option-cell">
                        <label
                            style="display: block; font-weight: 600; margin-bottom: 0.5rem; color: var(--text-muted);">Option
                            A <span style="color: var(--danger-color);">*</span></label>
                        <div class="quill-editor minimal" data-placeholder="Option A"></div>
                        <input type="hidden" name="questions[__INDEX__].optionA" required>
                    </div>
                    <div class="option-cell">
                        <label
                            style="display: block; font-weight: 600; margin-bottom: 0.5rem; color: var(--text-muted);">Option
                            B <span style="color: var(--danger-color);">*</span></label>
                        <div class="quill-editor minimal" data-placeholder="Option B"></div>
                        <input type="hidden" name="questions[__INDEX__].optionB" required>
                    </div>
                    <div class="option-cell">
                        <label
                            style="display: block; font-weight: 600; margin-bottom: 0.5rem; color: var(--text-muted);">Option
                            C</label>
                        <div class="quill-editor minimal" data-placeholder="Option C"></div>
                        <input type="hidden" name="questions[__INDEX__].optionC">
                    </div>
                    <div class="option-cell">
                        <label
                            style="display: block; font-weight: 600; margin-bottom: 0.5rem; color: var(--text-muted);">Option
                            D</label>
                        <div class="quill-editor minimal" data-placeholder="Option D"></div>
                        <input type="hidden" name="questions[__INDEX__].optionD">
                    </div>
                    <div class="option-cell">
                        <label
                            style="display: block; font-weight: 600; margin-bottom: 0.5rem; color: var(--text-muted);">Option
                            E</label>
                        <div class="quill-editor minimal" data-placeholder="Option E"></div>
                        <input type="hidden" name="questions[__INDEX__].optionE">
                    </div>
                </div>

                <div style="display: flex; gap: 1.5rem; margin-top: 1.5rem;">
                    <div style="flex: 1;">
                        <label
                            style="display: block; font-weight: 600; margin-bottom: 0.5rem; color: var(--text-main);">Correct
                            Answer <span style="color: var(--danger-color);">*</span></label>
                        <select name="questions[__INDEX__].correctAnswer"
                            style="width: 100%; padding: 0.75rem; border: 1px solid var(--border-color); border-radius: var(--radius-md); background: white;"
                            required>
                            <option value="A">Option A</option>
                            <option value="B">Option B</option>
                            <option value="C">Option C</option>
                            <option value="D">Option D</option>
                            <option value="E">Option E</option>
                        </select>
                    </div>
                    <div style="flex: 1;">
                        <label
                            style="display: block; font-weight: 600; margin-bottom: 0.5rem; color: var(--text-main);">Marks
                            <span style="color: var(--danger-color);">*</span></label>
                        <input type="number" name="questions[__INDEX__].marks" value="1" step="0.5"
                            style="width: 100%; padding: 0.75rem; border: 1px solid var(--border-color); border-radius: var(--radius-md);"
                            required>
                    </div>
                </div>

                <div style="margin-bottom: 1.5rem; margin-top: 1.5rem;">
                    <label
                        style="display: block; font-weight: 600; margin-bottom: 0.5rem; color: var(--text-main);">Explanation
                        (Optional)</label>
                    <div class="quill-editor minimal" data-placeholder="Explain why the answer is correct..."></div>
                    <input type="hidden" name="questions[__INDEX__].explanation">
                </div>
            </div>
        </template>

        <!-- Edit Modal -->
        <div id="editQuestionModal" class="custom-modal">
            <div class="custom-modal-content">
                <div
                    style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.5rem; padding-bottom: 1rem; border-bottom: 1px solid var(--border-color);">
                    <h3 class="section-title" style="margin: 0;">Edit Question</h3>
                    <button type="button" class="btn btn-sm btn-outline-danger"
                        style="border: none; background: transparent;" onclick="closeEditModal()">
                        <i class="fas fa-times"></i>
                    </button>
                </div>

                <div class="modal-body">
                    <input type="hidden" id="edit-question-id">

                    <div style="margin-bottom: 1.5rem;">
                        <label style="display: block; font-weight: 600; margin-bottom: 0.5rem;">Instruction</label>
                        <div id="edit-instruction-editor" class="quill-editor minimal"></div>
                    </div>



                    <div style="margin-bottom: 1.5rem;">
                        <label style="display: block; font-weight: 600; margin-bottom: 0.5rem;">Question Text</label>
                        <div id="edit-questionText-editor" class="quill-editor"></div>
                    </div>

                    <div class="options-grid">
                        <div class="option-cell"><label
                                style="font-weight: 600; margin-bottom: 0.5rem; display: block;">Option A</label>
                            <div id="edit-optionA-editor" class="quill-editor minimal"></div>
                        </div>
                        <div class="option-cell"><label
                                style="font-weight: 600; margin-bottom: 0.5rem; display: block;">Option B</label>
                            <div id="edit-optionB-editor" class="quill-editor minimal"></div>
                        </div>
                        <div class="option-cell"><label
                                style="font-weight: 600; margin-bottom: 0.5rem; display: block;">Option C</label>
                            <div id="edit-optionC-editor" class="quill-editor minimal"></div>
                        </div>
                        <div class="option-cell"><label
                                style="font-weight: 600; margin-bottom: 0.5rem; display: block;">Option D</label>
                            <div id="edit-optionD-editor" class="quill-editor minimal"></div>
                        </div>
                        <div class="option-cell"><label
                                style="font-weight: 600; margin-bottom: 0.5rem; display: block;">Option E</label>
                            <div id="edit-optionE-editor" class="quill-editor minimal"></div>
                        </div>
                    </div>

                    <div style="display: flex; gap: 1.5rem; margin-top: 1.5rem;">
                        <div style="flex: 1;">
                            <label style="font-weight: 600; margin-bottom: 0.5rem; display: block;">Correct
                                Answer</label>
                            <select id="edit-correctAnswer"
                                style="width: 100%; padding: 0.75rem; border: 1px solid var(--border-color); border-radius: var(--radius-md);">
                                <option value="A">Option A</option>
                                <option value="B">Option B</option>
                                <option value="C">Option C</option>
                                <option value="D">Option D</option>
                                <option value="E">Option E</option>
                            </select>
                        </div>
                        <div style="flex: 1;">
                            <label style="font-weight: 600; margin-bottom: 0.5rem; display: block;">Marks</label>
                            <input type="number" id="edit-marks" step="0.5"
                                style="width: 100%; padding: 0.75rem; border: 1px solid var(--border-color); border-radius: var(--radius-md);">
                        </div>
                    </div>

                    <div style="margin-bottom: 1.5rem; margin-top: 1.5rem;">
                        <label style="display: block; font-weight: 600; margin-bottom: 0.5rem;">Explanation</label>
                        <div id="edit-explanation-editor" class="quill-editor minimal"></div>
                    </div>
                </div>

                <div
                    style="margin-top: 2rem; padding-top: 1.5rem; border-top: 1px solid var(--border-color); display: flex; justify-content: flex-end; gap: 1rem;">
                    <button type="button" class="btn btn-outline" onclick="closeEditModal()">Cancel</button>
                    <button type="button" class="btn btn-primary" onclick="saveEditedQuestion()">Save Changes</button>
                </div>
            </div>
        </div>

        <!-- AI Generation Modal -->
        <div id="aiGenerationModal" class="custom-modal">
            <div class="custom-modal-content" style="max-width: 520px;">
                <div
                    style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.5rem; padding-bottom: 1rem; border-bottom: 1px solid var(--border-color);">
                    <h3 class="section-title" style="margin: 0;"><i class="fas fa-robot"></i> AI Question Generator</h3>
                    <button type="button" class="btn btn-sm" style="border: none; background: transparent;"
                        onclick="closeAiModal()">
                        <i class="fas fa-times"></i>
                    </button>
                </div>

                <div class="modal-body">
                    <div id="ai-topics-container" style="margin-bottom: 1rem;">
                        <div class="topic-row">
                            <div class="topic-name-group">
                                <label style="display: block; font-weight: 600; margin-bottom: 0.5rem;">Area of Interest
                                    / Topic</label>
                                <input type="text" class="ai-topic-input" placeholder="e.g., Photosynthesis">
                            </div>
                            <div class="topic-inner-group">
                                <div class="topic-count-wrapper">
                                    <label
                                        style="display: block; font-weight: 600; margin-bottom: 0.5rem;">Count</label>
                                    <input type="number" class="ai-topic-count" value="5" min="1" max="20">
                                </div>
                                <button type="button" class="btn btn-sm"
                                    style="color: var(--danger-color); height: 44px; width: 44px; display: flex; align-items: center; justify-content: center; background: var(--bg-body); border: 1px solid var(--border-color);"
                                    onclick="removeTopicRow(this)">
                                    <i class="fas fa-trash"></i>
                                </button>
                            </div>
                        </div>
                    </div>

                    <button type="button" class="btn btn-sm btn-outline"
                        style="margin-bottom: 1.5rem; width: 100%; border-style: dashed; justify-content: center;"
                        onclick="addTopicRow()">
                        <i class="fas fa-plus"></i> Add Another Area
                    </button>

                    <div style="margin-bottom: 1rem;">
                        <label style="display: block; font-weight: 600; margin-bottom: 0.5rem;">Options per
                            Question</label>
                        <select id="ai-optionsCount"
                            style="width: 100%; padding: 0.75rem; border: 1px solid var(--border-color); border-radius: var(--radius-md); background: white;">
                            <option value="2">2 Options (A, B)</option>
                            <option value="3">3 Options (A, B, C)</option>
                            <option value="4" selected>4 Options (A, B, C, D)</option>
                            <option value="5">5 Options (A, B, C, D, E)</option>
                        </select>
                    </div>
                </div>

                <div class="modal-footer">
                    <button type="button" class="btn btn-outline" onclick="closeAiModal()">Cancel</button>
                    <button type="button" class="btn btn-primary" id="ai-generate-btn"
                        style="background: #db2777; border-color: #db2777;" onclick="generateAiQuestions()">
                        <i class="fas fa-magic"></i> Generate Questions
                    </button>
                </div>
            </div>
        </div>
    </div>

    <script th:inline="javascript">
        // Thymeleaf variables need inlining
        const examinationId = /*[[${examination.id}]]*/ null;
        const classId = /*[[${classId}]]*/ null;
    </script>

    <script th:inline="none">
        // Main logic without Thymeleaf inlining to prevent array parsing errors
        (function () {
            console.log('Questions management script starting...');

            // ... (rest of the logic using the global variables defined above)

            window.quillInstances = window.quillInstances || new Map();
            const MAX_IMAGE_SIZE = 500 * 1024;

            window.refreshQuestionsList = async function () {
                const url = `/staff/classes/${classId}/examinations/${examinationId}/questions`;
                try {
                    const response = await fetch(url);
                    if (!response.ok) throw new Error('Failed to fetch questions');
                    const html = await response.text();
                    const tempDiv = document.createElement('div');
                    tempDiv.innerHTML = html;
                    const newList = tempDiv.querySelector('#existingQuestionsList');
                    const currentList = document.getElementById('existingQuestionsList');
                    if (newList && currentList) {
                        currentList.innerHTML = newList.innerHTML;
                    } else {
                        const contentArea = document.getElementById('class-detail-content');
                        if (contentArea) contentArea.innerHTML = html;
                    }
                } catch (err) { console.error(err); }
            };

            function ensureQuill() {
                return new Promise((resolve, reject) => {
                    if (typeof Quill !== 'undefined') { resolve(); return; }
                    if (window.loadingQuill) {
                        const check = setInterval(() => { if (typeof Quill !== 'undefined') { clearInterval(check); resolve(); } }, 100);
                        return;
                    }
                    window.loadingQuill = true;
                    const link = document.createElement('link');
                    link.rel = 'stylesheet';
                    link.href = 'https://cdn.quilljs.com/1.3.6/quill.snow.css';
                    document.head.appendChild(link);
                    const script = document.createElement('script');
                    script.src = 'https://cdn.quilljs.com/1.3.6/quill.min.js';
                    script.onload = () => { window.loadingQuill = false; resolve(); };
                    document.head.appendChild(script);
                });
            }

            window.initQuill = async function (container) {
                if (!container) return;
                await ensureQuill();
                const editors = container.querySelectorAll('.quill-editor');
                editors.forEach(editor => {
                    if (editor.classList.contains('ql-container')) return;
                    const isMinimal = editor.classList.contains('minimal');
                    const toolbarOptions = isMinimal ? [['bold', 'italic', 'underline'], ['image'], ['clean']] : [['bold', 'italic', 'underline'], [{ 'list': 'ordered' }, { 'list': 'bullet' }], ['image'], ['clean']];

                    const quill = new Quill(editor, { theme: 'snow', modules: { toolbar: toolbarOptions }, placeholder: editor.getAttribute('data-placeholder') || 'Type here...' });

                    // Image handler logic (omitted for brevity but assumed present)
                    quill.getModule('toolbar').addHandler('image', () => {
                        const input = document.createElement('input');
                        input.setAttribute('type', 'file');
                        input.setAttribute('accept', 'image/*');
                        input.click();
                        input.onchange = () => {
                            const file = input.files[0];
                            if (file) {
                                const reader = new FileReader();
                                reader.onload = (e) => {
                                    const range = quill.getSelection();
                                    quill.insertEmbed(range.index, 'image', e.target.result);
                                };
                                reader.readAsDataURL(file);
                            }
                        };
                    });

                    window.quillInstances.set(editor, quill);

                    // Sync content on change
                    quill.on('text-change', () => {
                        const input = editor.nextElementSibling;
                        if (input) input.value = quill.root.innerHTML;
                    });
                });
            };

            window.addQuestion = async function () {
                const template = document.getElementById('questionTemplate');
                const container = document.getElementById('newQuestionsList');
                const index = window.questionsManagement ? window.questionsManagement.questionCount : document.querySelectorAll('.question-card').length;

                let html = template.innerHTML.replace(/__INDEX__/g, index).replace(/__NUMBER__/g, index + 1);
                const tempDiv = document.createElement('div');
                tempDiv.innerHTML = html;
                const card = tempDiv.firstElementChild;
                container.appendChild(card);
                await window.initQuill(card);

                if (window.questionsManagement) window.questionsManagement.questionCount = index + 1;
                card.scrollIntoView({ behavior: 'smooth' });
            };

            window.removeQuestion = function (btn) {
                const card = btn.closest('.question-card');
                if (card) {
                    card.querySelectorAll('.quill-editor').forEach(e => window.quillInstances.delete(e));
                    card.remove();
                }
            };

            // Edit Logic
            window.editQuestion = async function (questionId) {
                const url = `/staff/classes/${classId}/questions/${questionId}`;
                const response = await fetch(url);
                const data = await response.json();

                const modal = document.getElementById('editQuestionModal');
                document.body.appendChild(modal); // Move to body

                document.getElementById('edit-question-id').value = data.id;
                document.getElementById('edit-correctAnswer').value = data.correctAnswer;
                document.getElementById('edit-marks').value = data.marks;

                modal.classList.add('active'); // Use active class

                await window.initQuill(modal);

                // Set content
                const setContent = (id, content) => {
                    const el = document.getElementById(id);
                    const quill = window.quillInstances.get(el);
                    if (quill && content) quill.root.innerHTML = content;
                };

                setContent('edit-instruction-editor', data.instruction);
                setContent('edit-explanation-editor', data.explanation);
                setContent('edit-questionText-editor', data.questionText);
                setContent('edit-optionA-editor', data.optionA);
                setContent('edit-optionB-editor', data.optionB);
                setContent('edit-optionC-editor', data.optionC);
                setContent('edit-optionD-editor', data.optionD);
                setContent('edit-optionE-editor', data.optionE);
            };

            window.closeEditModal = function () {
                document.getElementById('editQuestionModal').classList.remove('active');
            };

            window.saveEditedQuestion = async function () {
                const id = document.getElementById('edit-question-id').value;
                const getContent = (id) => {
                    const el = document.getElementById(id);
                    const quill = window.quillInstances.get(el);
                    return quill ? quill.root.innerHTML : '';
                };

                const formData = new FormData();
                formData.append('instruction', getContent('edit-instruction-editor'));
                formData.append('explanation', getContent('edit-explanation-editor'));
                formData.append('questionText', getContent('edit-questionText-editor'));
                formData.append('optionA', getContent('edit-optionA-editor'));
                formData.append('optionB', getContent('edit-optionB-editor'));
                formData.append('optionC', getContent('edit-optionC-editor'));
                formData.append('optionD', getContent('edit-optionD-editor'));
                formData.append('optionE', getContent('edit-optionE-editor'));
                formData.append('correctAnswer', document.getElementById('edit-correctAnswer').value);
                formData.append('marks', document.getElementById('edit-marks').value);

                // CSRF
                const csrfToken = document.querySelector('meta[name="_csrf"]')?.getAttribute('content');

                try {
                    const res = await fetch(`/staff/classes/${classId}/examinations/${examinationId}/questions/${id}/update`, {
                        method: 'POST',
                        headers: { 'X-CSRF-TOKEN': csrfToken },
                        body: formData
                    });
                    const result = await res.json();
                    if (result.success) {
                        closeEditModal();
                        refreshQuestionsList();
                    } else {
                        alert(result.message);
                    }
                } catch (e) { console.error(e); alert('Error saving question'); }
            };

            window.deleteQuestion = async function (questionId) {
                if (!confirm('Are you sure you want to delete this question? This action cannot be undone.')) return;

                const csrfToken = document.querySelector('meta[name="_csrf"]')?.getAttribute('content');
                const url = `/staff/classes/${classId}/examinations/${examinationId}/questions/${questionId}/delete`;

                try {
                    const res = await fetch(url, {
                        method: 'POST',
                        headers: { 'X-CSRF-TOKEN': csrfToken }
                    });
                    const result = await res.json();
                    if (result.success) {
                        refreshQuestionsList();
                    } else {
                        alert(result.message || 'Failed to delete question');
                    }
                } catch (e) {
                    console.error(e);
                    alert('Error deleting question');
                }
            };

            window.goBackToAssessments = function () {
                // Find the active class card in the sidebar
                const activeCard = document.querySelector('.class-card.active');
                if (activeCard && typeof loadClassDetails === 'function') {
                    // Reload the class details to restore tabs
                    loadClassDetails(activeCard).then(() => {
                        // After reload, switch to assessments tab
                        const tab = document.querySelector('.tab-btn[data-tab="assessments"]');
                        if (tab) tab.click();
                    });
                } else {
                    // Fallback if something is wrong
                    window.location.reload();
                }
            };

            // Form Submit for New Questions
            const form = document.getElementById('questionsForm');
            if (form) {
                form.addEventListener('submit', async function (e) {
                    e.preventDefault();
                    // Sync all quills
                    document.querySelectorAll('.quill-editor').forEach(editor => {
                        const input = editor.nextElementSibling;
                        const quill = window.quillInstances.get(editor);
                        if (input && quill) input.value = quill.root.innerHTML;
                    });

                    const formData = new FormData(this);
                    const csrfToken = document.querySelector('meta[name="_csrf"]')?.getAttribute('content');

                    try {
                        const res = await fetch(`/staff/classes/${classId}/examinations/${examinationId}/questions/save`, {
                            method: 'POST',
                            headers: { 'X-CSRF-TOKEN': csrfToken },
                            body: formData
                        });
                        const result = await res.json();
                        if (result.success) {
                            alert('Questions saved successfully!');
                            refreshQuestionsList();
                            document.getElementById('newQuestionsList').innerHTML = '';
                        } else {
                            alert(result.message);
                        }
                    } catch (e) { console.error(e); alert('Error saving questions'); }
                });
            }

            // AI Generation Logic
            window.showAiModal = function () {
                document.getElementById('aiGenerationModal').classList.add('active');
            };

            window.closeAiModal = function () {
                document.getElementById('aiGenerationModal').classList.remove('active');
            };

            window.addTopicRow = function () {
                const container = document.getElementById('ai-topics-container');
                const row = document.createElement('div');
                row.className = 'topic-row';
                row.innerHTML = `
                    <div class="topic-name-group">
                        <input type="text" class="ai-topic-input" placeholder="e.g., Photosynthesis">
                    </div>
                    <div class="topic-inner-group">
                        <div class="topic-count-wrapper">
                            <input type="number" class="ai-topic-count" value="5" min="1" max="20">
                        </div>
                        <button type="button" class="btn btn-sm" 
                            style="color: var(--danger-color); height: 44px; width: 44px; display: flex; align-items: center; justify-content: center; background: var(--bg-body); border: 1px solid var(--border-color);" 
                            onclick="removeTopicRow(this)">
                            <i class="fas fa-trash"></i>
                        </button>
                    </div>
                `;
                container.appendChild(row);
            };

            window.removeTopicRow = function (btn) {
                const rows = document.querySelectorAll('.topic-row');
                if (rows.length > 1) {
                    btn.closest('.topic-row').remove();
                } else {
                    alert('You must have at least one topic area.');
                }
            };

            window.generateAiQuestions = async function () {
                const topics = [];
                document.querySelectorAll('.topic-row').forEach(row => {
                    const name = row.querySelector('.ai-topic-input').value.trim();
                    const count = parseInt(row.querySelector('.ai-topic-count').value);
                    if (name) {
                        topics.push({ topic: name, questionCount: count });
                    }
                });

                const optionsCount = document.getElementById('ai-optionsCount').value;

                if (topics.length === 0) {
                    alert('Please specify at least one topic or area of interest.');
                    return;
                }

                const generateBtn = document.getElementById('ai-generate-btn');
                const originalBtnText = generateBtn.innerHTML;
                generateBtn.disabled = true;
                generateBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Generating...';

                const csrfToken = document.querySelector('meta[name="_csrf"]')?.getAttribute('content');

                try {
                    const response = await fetch(`/staff/classes/${classId}/examinations/${examinationId}/ai-generate`, {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                            'X-CSRF-TOKEN': csrfToken
                        },
                        body: JSON.stringify({
                            topics: topics,
                            optionsCount: parseInt(optionsCount)
                        })
                    });

                    const result = await response.json();
                    if (result.success) {
                        for (const q of result.questions) {
                            await addQuestionFromAi(q);
                        }
                        closeAiModal();
                        alert(`Successfully generated ${result.questions.length} questions. Please review and save them.`);
                    } else {
                        alert(result.message || 'Failed to generate questions');
                    }
                } catch (error) {
                    console.error('AI Generation Error:', error);
                    alert('An error occurred while generating questions.');
                } finally {
                    generateBtn.disabled = false;
                    generateBtn.innerHTML = originalBtnText;
                }
            };

            window.addQuestionFromAi = async function (qData) {
                const template = document.getElementById('questionTemplate');
                const container = document.getElementById('newQuestionsList');
                const index = window.questionsManagement ? window.questionsManagement.questionCount : document.querySelectorAll('.question-card').length;

                let html = template.innerHTML.replace(/__INDEX__/g, index).replace(/__NUMBER__/g, index + 1);
                const tempDiv = document.createElement('div');
                tempDiv.innerHTML = html;
                const card = tempDiv.firstElementChild;
                container.appendChild(card);

                await window.initQuill(card);

                // Set content to Quill instances
                const cardQuills = card.querySelectorAll('.quill-editor');
                cardQuills.forEach(editor => {
                    const quill = window.quillInstances.get(editor);
                    if (!quill) return;

                    const input = editor.nextElementSibling;
                    let content = '';

                    if (input.name.includes('instruction')) content = qData.instruction || '';
                    else if (input.name.includes('questionText')) content = qData.questionText || '';
                    else if (input.name.includes('optionA')) content = qData.optionA || '';
                    else if (input.name.includes('optionB')) content = qData.optionB || '';
                    else if (input.name.includes('optionC')) content = qData.optionC || '';
                    else if (input.name.includes('optionD')) content = qData.optionD || '';
                    else if (input.name.includes('optionE')) content = qData.optionE || '';
                    else if (input.name.includes('explanation')) content = qData.explanation || '';

                    quill.root.innerHTML = content;
                    input.value = content;
                });

                // Set correct answer and marks
                card.querySelector(`select[name="questions[${index}].correctAnswer"]`).value = qData.correctAnswer;
                card.querySelector(`input[name="questions[${index}].marks"]`).value = qData.marks || 1;

                if (window.questionsManagement) window.questionsManagement.questionCount = index + 1;
            };

        })();
    </script>
</th:block>
