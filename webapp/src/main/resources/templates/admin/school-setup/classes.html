<!DOCTYPE html>

<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>4School - Classes</title>
    <link rel="stylesheet" th:href="@{/css/common.css}" />
    <link rel="stylesheet" th:href="@{/css/dashboard.css}" />
    <link rel="stylesheet" th:href="@{/css/school-setup.css}" />
    <style>
        .setup-content .setup-header,
        .construction-card {
            border-radius: 16px;
            box-shadow: 0 10px 24px rgba(15, 23, 42, 0.08);
        }

        .setup-content .setup-header {
            padding: 1.25rem 1.5rem;
            margin-bottom: 1.5rem;
        }

        .construction-card {
            padding: 1.5rem;
            background: #fff;
        }

        .construction-card .alert {
            margin: 0;
            border-radius: 12px;
        }
    </style>
</head>

<body>
    <!-- Include School Header -->
    <div th:replace="~{fragments/header :: school-header}"></div>

    <main class="main-content setup-layout">
        <!-- Global Admin Sidebar -->
        <div th:replace="~{fragments/admin-sidebar :: admin-sidebar(activePage='setup')}"></div>

        <!-- Include Sidebar -->

        <!-- Main Content Area -->
        <div class="setup-content">
            <div class="setup-header">
                <h1>Classes</h1>
                <p>Set up the classes and assign them to education tracks.</p>
            </div>

            <div class="construction-card">
                <div class="alert alert-info">
                    This section is under construction.
                </div>
            </div>
        </div>
    </main>
</body>

</html>
