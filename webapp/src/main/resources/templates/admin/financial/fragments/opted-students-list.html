<div th:fragment="opted-students-list">
    <div class="opted-students-container">
        <div class="modal-header"
            style="border-bottom: 1px solid #e5e7eb; padding-bottom: 16px; margin-bottom: 16px; display: flex; justify-content: space-between; align-items: center;">
            <div>
                <h3 style="margin: 0; font-size: 1.2rem; font-weight: 600;" th:text="${classFeeItem.feeItem.name}">Fee
                    Name</h3>
                <p style="margin: 4px 0 0 0; font-size: 0.85rem; color: #6b7280;"
                    th:text="${classFeeItem.schoolClass.className}">Class Name</p>
            </div>
            <div class="modal-actions" style="display: flex; gap: 8px;">
                <button class="btn btn-sm btn-danger"
                    th:attr="onclick='lockAllOptedStudents(\'' + ${classFeeItem.id} + '\', true)'">
                    <i class="fas fa-lock"></i> Lock All
                </button>
                <button class="btn btn-sm btn-success"
                    th:attr="onclick='lockAllOptedStudents(\'' + ${classFeeItem.id} + '\', false)'">
                    <i class="fas fa-unlock"></i> Unlock All
                </button>
            </div>
        </div>

        <div class="table-container" style="max-height: 400px; overflow-y: auto;">
            <table class="data-table">
                <thead>
                    <tr>
                        <th>Student</th>
                        <th>Status</th>
                        <th style="text-align: right;">Action</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="sof : ${optedFees}" th:id="'modal-row-' + ${sof.id}">
                        <td>
                            <div style="font-weight: 500;"
                                th:text="${sof.student.user.firstName + ' ' + sof.student.user.lastName}">Student Name
                            </div>
                            <div style="font-size: 0.8rem; color: #6b7280;" th:text="${sof.student.admissionNumber}">
                                Admission No</div>
                        </td>
                        <td>
                            <span th:if="${sof.isLocked}" class="badge badge-danger"
                                th:id="'modal-status-' + ${sof.id}">Locked</span>
                            <span th:unless="${sof.isLocked}" class="badge badge-success"
                                th:id="'modal-status-' + ${sof.id}">Active</span>
                        </td>
                        <td style="text-align: right;">
                            <button class="btn btn-icon-sm"
                                th:classappend="${sof.isLocked ? 'btn-outline-success' : 'btn-outline-danger'}"
                                th:id="'modal-btn-' + ${sof.id}"
                                th:attr="onclick='toggleModalFeeLock(\'' + ${sof.id} + '\', ' + ${!sof.isLocked} + ')'"
                                th:title="${sof.isLocked ? 'Unlock' : 'Lock'}">
                                <i class="fas" th:classappend="${sof.isLocked ? 'fa-unlock' : 'fa-lock'}"></i>
                            </button>
                        </td>
                    </tr>
                    <tr th:if="${#lists.isEmpty(optedFees)}">
                        <td colspan="3" style="text-align: center; padding: 32px; color: #6b7280;">
                            <i class="fas fa-users-slash"
                                style="font-size: 2rem; display: block; margin-bottom: 8px; opacity: 0.5;"></i>
                            No students have opted in for this fee yet.
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>

        <div class="modal-footer"
            style="margin-top: 16px; border-top: 1px solid #e5e7eb; padding-top: 16px; text-align: right;">
            <button class="btn btn-outline" onclick="closeOptedStudentsModal()">Close</button>
        </div>
    </div>
</div>
