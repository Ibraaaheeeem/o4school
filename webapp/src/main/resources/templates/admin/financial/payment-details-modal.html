<!DOCTYPE html>

<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <style>
        #paymentDetailsModal .modal-content {
            border-radius: 16px;
            box-shadow: 0 16px 36px rgba(15, 23, 42, 0.18);
            overflow: hidden;
        }

        #paymentDetailsModal .modal-header,
        #paymentDetailsModal .modal-body {
            padding: 1rem 1.25rem;
        }

        #paymentDetailsModal .loading {
            padding: 1rem;
            border-radius: 10px;
            background: #f8fafc;
            border: 1px solid #e5e7eb;
        }

        .btn.btn-sm.btn-primary {
            border-radius: 10px;
        }
    </style>
</head>
<body>
    <!-- Payment Details Modal Fragment -->
    <div th:fragment="payment-details-modal" id="paymentDetailsModal" class="modal" style="display: none;">
        <div class="modal-content">
            <div class="modal-header">
                <h3>Payment Details</h3>
                <span class="close" onclick="closePaymentModal()">&times;</span>
            </div>
            <div class="modal-body" id="paymentDetailsContent">
                <div class="loading">Loading payment details...</div>
            </div>
        </div>
    </div>

    <!-- View Details Button Fragment -->
    <button th:fragment="view-details-btn" class="btn btn-sm btn-primary" 
            th:onclick="'showPaymentDetails(\'' + ${itemId} + '\')'">
        View Details
    </button>
</body>
</html>
