<div class="modal-dialog modal-content compact">
    <div class="modal-header">
        <h2 th:text="${isEdit ? 'Edit Examination' : 'Create New Examination'}">Create New Examination</h2>
        <button type="button" class="modal-close" onclick="closeModal('examinationModal')">&times;</button>
    </div>

    <div class="modal-body">
        <form
            th:attr="hx-post=${formAction}, hx-headers='{&quot;X-CSRF-TOKEN&quot;: &quot;' + ${_csrf.token} + '&quot;}'"
            method="POST" hx-target="#messageContainer" hx-swap="innerHTML" id="examinationForm">


            <input type="hidden" name="id" th:value="${examination.id}" th:if="${isEdit}">

            <div class="alert alert-warning mb-4" th:if="${isCurrentTermSelected != true}"
                style="padding: 0.75rem 1rem; border-left: 4px solid #f59e0b; background-color: #fffbeb; color: #92400e; border-radius: 4px; display: flex; align-items: center; gap: 0.75rem">
                <i class="fas fa-exclamation-triangle"></i>
                <div>
                    <strong>Warning: Non-Current Term</strong>
                    <div style="font-size: 0.9em">Please, note: You are not working in the current term. </div>
                </div>
            </div>

            <div class="modal-grid">
                <!-- Row 1: Title (Full) -->
                <div class="form-group full-width">
                    <label for="title">Examination Title</label>
                    <input type="text" id="title" name="title" class="form-input" th:value="${examination.title}"
                        required placeholder="e.g., First Term CA 1">
                </div>

                <!-- Row 2: Track | Class -->
                <div class="form-group">
                    <label for="trackId">Education Track</label>
                    <th:block th:if="${lockedClass != null}">
                        <input type="hidden" id="trackId" name="trackId" th:value="${lockedClass.track.id}">
                        <input type="text" class="form-input" th:value="${lockedClass.track.name}" readonly
                            style="background-color: #f3f4f6; cursor: not-allowed;">
                    </th:block>
                    <th:block th:unless="${lockedClass != null}">
                        <select id="trackId" class="form-select" required onchange="loadClassesFromTrack()">
                            <option value="">Select Track</option>
                            <option th:each="track : ${educationTracks}" th:value="${track.id}" th:text="${track.name}">
                            </option>
                        </select>
                    </th:block>
                </div>

                <div class="form-group">
                    <label for="classId">Class</label>
                    <th:block th:if="${lockedClass != null}">
                        <input type="hidden" id="classId" name="classId" th:value="${lockedClass.id}">
                        <input type="text" class="form-input" th:value="${lockedClass.className}" readonly
                            style="background-color: #f3f4f6; cursor: not-allowed;">
                    </th:block>
                    <th:block th:unless="${lockedClass != null}">
                        <select id="classId" name="classId" class="form-select" required disabled
                            onchange="loadSubjects()">
                            <option value="">Select Track First</option>
                        </select>
                    </th:block>
                </div>

                <!-- Row 3: Subject | Exam Type -->
                <div class="form-group">
                    <label for="subjectId">Subject</label>
                    <th:block th:if="${lockedSubject != null}">
                        <input type="hidden" id="subjectId" name="subjectId" th:value="${lockedSubject.id}">
                        <input type="text" class="form-input" th:value="${lockedSubject.subjectName}" readonly
                            style="background-color: #f3f4f6; cursor: not-allowed;">
                    </th:block>
                    <th:block th:unless="${lockedSubject != null}">
                        <select id="subjectId" name="subjectId" class="form-select" required
                            th:disabled="${subjects == null || subjects.isEmpty()}">
                            <option value="">Select Subject</option>
                            <!-- Use subjects from model if available -->
                            <option th:if="${subjects != null}" th:each="subject : ${subjects}" th:value="${subject.id}"
                                th:text="${subject.subjectName}"
                                th:selected="${examination.subject != null && examination.subject.id == subject.id}">
                            </option>
                            <!-- Fallback/Loading state if no subjects provided -->
                            <option th:if="${subjects == null && lockedClass != null}" value="">Loading subjects...
                            </option>
                        </select>
                    </th:block>
                </div>

                <div class="form-group">
                    <label for="examType">Examination Type</label>
                    <select id="examType" name="examType" class="form-select" required>
                        <option value="">Select Type</option>
                        <option th:each="type : ${examTypes}" th:value="${type}" th:text="${type}"
                            th:selected="${examination.examType == type}">
                        </option>
                    </select>
                </div>

                <!-- Row 4: Duration | Total Marks -->
                <div class="form-group">
                    <label for="durationMinutes">Duration (Minutes)</label>
                    <input type="number" id="durationMinutes" name="durationMinutes" class="form-input"
                        th:value="${examination.durationMinutes ?: 60}" min="1" max="480" required>
                </div>

                <div class="form-group">
                    <label for="totalMarks">Total Marks</label>
                    <input type="number" id="totalMarks" name="totalMarks" class="form-input"
                        th:value="${examination.totalMarks}" min="1" max="1000">
                </div>

                <div class="form-group">
                    <label for="startTime">Start Date & Time</label>
                    <div class="input-with-icon">
                        <i class="fas fa-calendar-alt"></i>
                        <input type="text" id="startTime" name="startTime" class="form-input date-time-picker"
                            th:value="${examination.startTime != null ? #temporals.format(examination.startTime, 'dd/MM/yyyy HH:mm') : ''}"
                            placeholder="Select Start Date & Time" readonly>
                    </div>
                </div>

                <div class="form-group">
                    <label for="endTime">End Date & Time</label>
                    <div class="input-with-icon">
                        <i class="fas fa-calendar-check"></i>
                        <input type="text" id="endTime" name="endTime" class="form-input date-time-picker"
                            th:value="${examination.endTime != null ? #temporals.format(examination.endTime, 'dd/MM/yyyy HH:mm') : ''}"
                            placeholder="Select End Date & Time" readonly>
                    </div>
                </div>

                <!-- Row 6: Examination Mode -->
                <div class="form-group full-width">
                    <label
                        style="color: #4b5563; font-weight: 700; font-size: 0.9rem; margin-bottom: 0.5rem;">Examination
                        Mode</label>
                    <div class="exam-mode-wrapper">
                        <input type="checkbox" id="isOnline" name="isOnline" class="mode-checkbox-hidden" value="true"
                            th:checked="${examination.isOnline}">

                        <label for="isOnline" class="mode-toggle-container">
                            <span class="mode-label-text offline">
                                <i class="fas fa-file-alt"></i> Paper / Offline
                            </span>
                            <div class="mode-switch-track"></div>
                            <span class="mode-label-text online">
                                <i class="fas fa-laptop-code"></i> Online (CBT)
                            </span>
                        </label>
                    </div>
                </div>
            </div>

            <!-- Publish Immediately Checkbox -->
            <div class="form-group full-width" style="margin-top: 0.5rem;">
                <label class="custom-checkbox"
                    style="display: flex; align-items: center; gap: 0.5rem; cursor: pointer;">
                    <input type="checkbox" name="isPublished" value="true" th:checked="${examination.isPublished}"
                        style="width: 1.2rem; height: 1.2rem; accent-color: var(--primary-color);">
                    <span style="font-weight: 500; color: var(--text-main);">Publish Immediately</span>
                </label>
                <p style="font-size: 0.8rem; color: var(--text-muted); margin-left: 1.7rem; margin-top: 0.2rem;">
                    If checked, students will be able to see this examination immediately after creation/update.
                </p>
            </div>
    </div>

    <div class="modal-footer">
        <button type="button" class="btn btn-outline" onclick="closeModal('examinationModal')">Cancel</button>
        <button type="submit" form="examinationForm" class="btn btn-primary" th:disabled="${headerContextTerm == null}">
            <i class="fas fa-save me-2"></i>
            <span th:text="${isEdit ? 'Update Examination' : 'Create Examination'}">Create Examination</span>
        </button>
    </div>
    </form>

    <!-- Message Container -->
    <div id="messageContainer" class="mt-3"></div>
</div>
</div>

<script th:inline="javascript">
    // Hierarchical Selection Functions - Use window scope to avoid redeclaration
    if (typeof window.isEditMode === 'undefined') {
        window.isEditMode = false;
    }
    if (typeof window.editExamination === 'undefined') {
        window.editExamination = null;
    }

    // Initialize the form when modal opens
    (function () {
        initializeHierarchicalSelection();
        initializeDatePickers();
    })();

    function initializeDatePickers() {
        const config = {
            enableTime: true,
            dateFormat: "d/m/Y H:i",
            allowInput: true,
            time_24hr: true,
            minuteIncrement: 1,
            static: true // Ensures it appears correctly in modally-positioned containers
        };

        if (typeof flatpickr !== 'undefined') {
            flatpickr("#startTime", config);
            flatpickr("#endTime", config);
        } else {
            console.warn('Flatpickr not loaded yet, retrying...');
            setTimeout(initializeDatePickers, 500);
        }
    }

    function initializeHierarchicalSelection() {
        // Check if this is edit mode
        const examinationId = document.querySelector('input[name="id"]');
        window.isEditMode = examinationId && examinationId.value;
        const lockedClassId = document.getElementById('classId') && document.getElementById('classId').type === 'hidden' ? document.getElementById('classId').value : null;

        if (lockedClassId) {
            // If class is locked but subject is NOT locked (Class Teacher creating exam), load subjects
            const subjectInput = document.getElementById('subjectId');
            if (subjectInput && subjectInput.tagName === 'SELECT') {
                // Only load if not already populated by server (more than just the placeholder)
                if (subjectInput.options.length <= 1) {
                    loadSubjects();
                }
            }
        } else if (window.isEditMode) {
            // Store examination data for edit mode
            window.editExamination = {
                classId: /*[[${examination.schoolClass?.id}]]*/ null,
                subjectId: /*[[${examination.subject?.id}]]*/ null
            };

            // If we have a class ID, try to reconstruct the hierarchy
            if (window.editExamination.classId) {
                reconstructHierarchyForEdit();
            }
        }
    }

    async function loadClassesFromTrack() {
        const trackId = document.getElementById('trackId').value;
        const classSelect = document.getElementById('classId');
        const subjectSelect = document.getElementById('subjectId');

        // Reset dependent dropdowns
        classSelect.innerHTML = '<option value="">Choose class...</option>';
        subjectSelect.innerHTML = '<option value="">Choose subject...</option>';

        classSelect.disabled = true;
        subjectSelect.disabled = true;

        if (!trackId) return;

        try {
            // Using the new endpoint that fetches classes directly by track
            const response = await fetch(`/admin/assessments/api/tracks/${trackId}/classes`);
            const classes = await response.json();

            classes.forEach(schoolClass => {
                const option = document.createElement('option');
                option.value = schoolClass.id;
                option.textContent = schoolClass.name; // API returns 'name' (mapped from className)
                classSelect.appendChild(option);
            });

            classSelect.disabled = false;
        } catch (error) {
            console.error('Error loading classes:', error);
        }
    }

    async function loadSubjects() {
        const classInput = document.getElementById('classId');
        const classId = classInput.value;
        const subjectSelect = document.getElementById('subjectId');

        // Reset subject dropdown
        subjectSelect.innerHTML = '<option value="">Choose subject...</option>';
        subjectSelect.disabled = true;

        if (!classId) return;

        try {
            const response = await fetch(`/admin/assessments/api/classes/${classId}/subjects`);
            const subjects = await response.json();

            subjects.forEach(subject => {
                const option = document.createElement('option');
                option.value = subject.id;
                option.textContent = subject.name;
                subjectSelect.appendChild(option);
            });

            subjectSelect.disabled = false;

            // If edit mode or context logic requires selecting the subject
            // If locked class is present (Staff mode), allowing subject selection
            // If we have a pre-selected subject from model (though that case usually renders hidden input), handle it
        } catch (error) {
            console.error('Error loading subjects:', error);
        }
    }

    async function reconstructHierarchyForEdit() {
        try {
            // Get the class hierarchy information
            const response = await fetch(`/admin/assessments/api/classes/${window.editExamination.classId}/hierarchy`);
            const hierarchy = await response.json();

            // Select the track
            const trackSelect = document.getElementById('trackId');
            trackSelect.value = hierarchy.trackId;

            // Load and select class (directly from track now)
            await loadClassesFromTrack();
            const classSelect = document.getElementById('classId');
            classSelect.value = hierarchy.classId;

            // Load and select subject
            await loadSubjects();
            const subjectSelect = document.getElementById('subjectId');
            subjectSelect.value = window.editExamination.subjectId;

        } catch (error) {
            console.error('Error reconstructing hierarchy for edit:', error);
            console.log('Edit mode: Please reselect the academic hierarchy');
        }
    }

    // Handle form submission success
    document.addEventListener('htmx:afterRequest', function (event) {
        if (event.detail.successful && event.target.id === 'examinationForm') {
            // Close modal after successful submission
            setTimeout(() => {
                if (typeof window.closeModal === 'function') {
                    window.closeModal('examinationModal');
                }
            }, 2000);
        }
    });
</script>
