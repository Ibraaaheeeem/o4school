<!-- Calendar Event Modal -->
<div class="modal-content">
    <style>
        .modal-content {
            border: 1px solid #e2e8f0;
            border-radius: 24px;
            overflow: hidden;
            box-shadow: 0 30px 80px rgba(15, 23, 42, 0.2);
        }

        .modal-header,
        .modal-footer {
            background: #fff;
            padding: 1.25rem 1.5rem;
        }

        .modal-header {
            border-bottom: 1px solid #e2e8f0;
        }

        .modal-header h3 {
            margin: 0;
            font-size: 1.2rem;
            font-weight: 700;
            color: #0f172a;
        }

        .modal-body {
            padding: 1.5rem;
            background: linear-gradient(180deg, #ffffff 0%, #f8fafc 100%);
        }

        .form-section {
            background: #fff;
            border: 1px solid #e2e8f0;
            border-radius: 18px;
            padding: 1.1rem;
            margin-bottom: 1rem;
        }

        .form-section h4 {
            margin-bottom: 1rem;
            font-size: 1rem;
            font-weight: 700;
            color: #0f172a;
        }

        .form-grid {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 1rem;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 0.45rem;
        }

        .form-group label {
            font-size: 0.88rem;
            font-weight: 600;
            color: #334155;
        }

        .form-input {
            min-height: 46px;
            border: 1px solid #dbe3ee;
            border-radius: 12px;
            padding: 0.75rem 0.9rem;
            box-shadow: none;
        }

        textarea.form-input {
            min-height: 110px;
        }

        .form-input:focus {
            border-color: #6366f1;
            box-shadow: 0 0 0 0.2rem rgba(99, 102, 241, 0.14);
            outline: none;
        }

        .modal-footer {
            border-top: 1px solid #e2e8f0;
            display: flex;
            justify-content: flex-end;
            gap: 0.75rem;
        }

        @media (max-width: 767.98px) {
            .form-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
    <div class="modal-header">
        <h3 th:text="${isEdit ? 'Edit Calendar Event' : 'New Calendar Event'}">New Calendar Event</h3>
        <button class="close-modal" onclick="closeModal('calendarModal')">&times;</button>
    </div>

    <form hx-post="/admin/academic/calendar/save-htmx" hx-target="#response-container" hx-swap="innerHTML"
        class="modal-form" th:attr="hx-headers='{&quot;X-CSRF-TOKEN&quot;: &quot;' + ${_csrf.token} + '&quot;}'">

        <input type="hidden" name="id" th:value="${isEdit ? calendarEvent.id : ''}">

        <div class="modal-body">
            <!-- Response Container -->
            <div id="response-container"></div>

            <!-- Event Information -->
            <div class="form-section">
                <h4>Event Information</h4>
                <div class="form-grid">
                    <div class="form-group">
                        <label for="eventName">Event Name *</label>
                        <input type="text" id="eventName" name="eventName" class="form-input"
                            th:value="${calendarEvent.eventName}" placeholder="e.g., First Term Examination" required>
                    </div>

                    <div class="form-group">
                        <label for="eventType">Event Type *</label>
                        <select id="eventType" name="eventType" class="form-input" required>
                            <option value="">Select Event Type</option>
                            <option th:each="type : ${eventTypes}" th:value="${type}" th:text="${type}"
                                th:selected="${isEdit && calendarEvent.eventType == type}">
                            </option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="description">Description</label>
                        <textarea id="description" name="description" class="form-input" rows="3"
                            th:text="${calendarEvent.description}"
                            placeholder="Additional details about this event"></textarea>
                    </div>
                </div>
            </div>

            <!-- Date Information -->
            <div class="form-section">
                <h4>Event Dates</h4>
                <div class="form-grid">
                    <div class="form-group">
                        <label for="startDate">Start Date <span class="text-xs text-muted">(dd/mm/yyyy)</span> *</label>
                        <input type="text" id="startDate" name="startDate" class="form-input"
                            th:value="${calendarEvent.startDate != null ? #temporals.format(calendarEvent.startDate, 'dd/MM/yyyy') : ''}"
                            placeholder="dd/MM/yyyy" pattern="\d{2}/\d{2}/\d{4}" title="Format: dd/MM/yyyy" required>
                    </div>
                    <div class="form-group">
                        <label for="endDate">End Date <span class="text-xs text-muted">(dd/mm/yyyy)</span></label>
                        <input type="text" id="endDate" name="endDate" class="form-input"
                            th:value="${calendarEvent.endDate != null ? #temporals.format(calendarEvent.endDate, 'dd/MM/yyyy') : ''}"
                            placeholder="dd/MM/yyyy" pattern="\d{2}/\d{2}/\d{4}" title="Format: dd/MM/yyyy">
                        <small class="form-help">Leave empty for single-day events</small>
                    </div>
                </div>
            </div>

            <!-- Event Settings -->

        </div>

        <div class="modal-footer">
            <button type="button" class="btn btn-outline" onclick="closeModal('calendarModal')">Cancel</button>
            <button type="submit" class="btn btn-primary">
                <span th:text="${isEdit ? 'Update Event' : 'Create Event'}">Create Event</span>
            </button>
        </div>
    </form>
</div>
