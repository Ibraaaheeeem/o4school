<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>4School - Academic Sessions</title>
    <link rel="stylesheet" th:href="@{/css/common.css}">
    <link rel="stylesheet" th:href="@{/css/dashboard.css}">
    <link rel="stylesheet" th:href="@{/css/school-setup.css}">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        .sessions-container {
            margin-top: 1.5rem;
        }

        .sessions-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
            gap: 1.5rem;
        }

        .session-card {
            background: linear-gradient(180deg, #ffffff 0%, #f8fafc 100%);
            border: 1px solid #e2e8f0;
            border-radius: 20px;
            padding: 1.5rem;
            box-shadow: 0 18px 40px rgba(15, 23, 42, 0.06);
            transition: transform 0.2s ease, box-shadow 0.2s ease, border-color 0.2s ease;
        }

        .session-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 24px 48px rgba(15, 23, 42, 0.1);
            border-color: #cbd5e1;
        }

        .session-card.current-session {
            border-color: #6366f1;
            box-shadow: 0 20px 45px rgba(99, 102, 241, 0.14);
        }

        .session-header,
        .session-actions,
        .session-details,
        .detail-item {
            display: flex;
        }

        .session-header {
            justify-content: space-between;
            align-items: flex-start;
            gap: 1rem;
            margin-bottom: 1.25rem;
        }

        .session-info h3 {
            margin-bottom: 0.35rem;
            font-size: 1.2rem;
            font-weight: 700;
            color: #0f172a;
        }

        .session-year {
            margin-bottom: 0.75rem;
            color: #64748b;
            font-weight: 500;
        }

        .session-actions {
            gap: 0.5rem;
            flex-shrink: 0;
        }

        .session-details {
            flex-direction: column;
            gap: 0.85rem;
            padding-top: 1rem;
            border-top: 1px solid #e2e8f0;
        }

        .detail-item {
            flex-direction: column;
            gap: 0.2rem;
        }

        .detail-label {
            font-size: 0.78rem;
            text-transform: uppercase;
            letter-spacing: 0.04em;
            font-weight: 700;
            color: #64748b;
        }

        .detail-value {
            color: #0f172a;
            line-height: 1.5;
        }

        .empty-state {
            margin-top: 1.5rem;
            background: #fff;
            border: 1px dashed #cbd5e1;
            border-radius: 20px;
            padding: 3rem 1.5rem;
            text-align: center;
            box-shadow: 0 18px 40px rgba(15, 23, 42, 0.05);
        }

        .empty-icon {
            font-size: 2.5rem;
            margin-bottom: 0.75rem;
        }

        @media (max-width: 767.98px) {
            .session-header {
                flex-direction: column;
            }

            .session-actions {
                width: 100%;
            }

            .session-actions .btn {
                flex: 1;
            }
        }
    </style>
</head>

<body>
    <!-- Include School Header -->
    <div th:replace="~{fragments/header :: school-header}"></div>

    <main class="main-content setup-layout">
        <!-- Global Admin Sidebar -->
        <div th:replace="~{fragments/admin-sidebar :: admin-sidebar(activePage='academic')}"></div>

        <!-- Include Academic Sidebar -->

        <!-- Main Content Area -->
        <div class="setup-content">
            <div class="setup-header">
                <div>
                    <h1>Academic Sessions</h1>
                    <p>Manage academic years and sessions for your school.</p>
                </div>
                <button class="btn btn-primary" hx-get="/admin/academic/sessions/new/modal"
                    hx-target="#sessionModal .modal-dialog" hx-swap="innerHTML"
                    onclick="setTimeout(() => openModal('sessionModal'), 100)">
                    <i class="fas fa-plus me-2"></i>New Academic Session
                </button>
            </div>

            <!-- Sessions List -->
            <div class="sessions-container" id="sessions-container" th:fragment="sessions-list"
                th:attr="hx-swap-oob=${swapOob}">
                <div class="sessions-grid" th:if="${!#lists.isEmpty(academicSessions)}">
                    <div th:each="academicSession : ${academicSessions}" class="session-card"
                        th:classappend="${academicSession.isCurrentSession ? 'current-session' : ''}">
                        <div class="session-header">
                            <div class="session-info">
                                <h3 th:text="${academicSession.sessionName}">2024-2025 Academic Session</h3>
                                <p class="session-year" th:text="${academicSession.sessionYear}">2024-2025</p>
                                <span th:if="${academicSession.isCurrentSession}" class="badge badge-success">Current
                                    Session</span>
                                <span th:unless="${academicSession.isCurrentSession}" class="badge badge-secondary"
                                    th:text="${academicSession.status}">Active</span>
                            </div>
                            <div class="session-actions">
                                <a class="btn btn-sm btn-primary"
                                    th:href="@{/admin/academic/sessions/{id}/terms(id=${academicSession.id})}">
                                    <i class="fas fa-calendar-week me-1"></i>Terms
                                </a>
                                <button class="btn btn-sm btn-outline"
                                    th:hx-get="@{/admin/academic/sessions/{id}/modal(id=${academicSession.id})}"
                                    hx-target="#sessionModal .modal-dialog" hx-swap="innerHTML"
                                    onclick="setTimeout(() => openModal('sessionModal'), 100)">
                                    <i class="fas fa-edit"></i>
                                </button>
                            </div>
                        </div>

                        <div class="session-details">
                            <div class="detail-item">
                                <span class="detail-label">Start Date:</span>
                                <span class="detail-value"
                                    th:text="${#temporals.format(academicSession.startDate, 'MMM dd, yyyy')}">Sep 15,
                                    2024</span>
                            </div>
                            <div class="detail-item" th:if="${academicSession.endDate}">
                                <span class="detail-label">End Date:</span>
                                <span class="detail-value"
                                    th:text="${#temporals.format(academicSession.endDate, 'MMM dd, yyyy')}">Jul 30,
                                    2025</span>
                            </div>
                            <div class="detail-item" th:if="${academicSession.notes}">
                                <span class="detail-label">Notes:</span>
                                <span class="detail-value" th:text="${academicSession.notes}">Regular academic
                                    session</span>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="empty-state" th:if="${#lists.isEmpty(academicSessions)}">
                    <div class="empty-icon">🎓</div>
                    <h3>No Academic Sessions</h3>
                    <p>Create your first academic session to get started.</p>
                    <button class="btn btn-primary" hx-get="/admin/academic/sessions/new/modal"
                        hx-target="#sessionModal .modal-dialog" hx-swap="innerHTML"
                        onclick="setTimeout(() => openModal('sessionModal'), 100)">
                        Create Academic Session
                    </button>
                </div>
            </div>
        </div>
    </main>

    <!-- Session Modal -->
    <div id="sessionModal" class="modal">
        <div class="modal-dialog">
            <!-- Modal content will be loaded here via HTMX -->
        </div>
    </div>

    <!-- Include HTMX -->
    <script src="https://unpkg.com/htmx.org@1.9.10"></script>
    <script th:src="@{/js/community.js}"></script>

    <script>
        // Modal functions
        window.openModal = function (modalId) {
            const modal = document.getElementById(modalId);
            if (modal) {
                modal.classList.add('active');
            }
        };

        window.closeModal = function (modalId) {
            const modal = document.getElementById(modalId);
            if (modal) {
                modal.classList.remove('active');
            }
        };

        // HTMX event handlers
        document.addEventListener('htmx:afterRequest', function (event) {
            if (event.detail.successful && event.detail.xhr.responseURL.includes('save-htmx')) {
                const modalId = 'sessionModal';
                const modal = document.getElementById(modalId);
                if (modal && modal.classList.contains('active')) {
                    setTimeout(() => closeModal(modalId), 1000);
                }
            }
        });
    </script>
</body>

</html>
