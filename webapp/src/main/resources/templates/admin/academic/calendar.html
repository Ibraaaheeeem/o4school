<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>4School - Academic Calendar</title>
    <link rel="stylesheet" th:href="@{/css/common.css}">
    <link rel="stylesheet" th:href="@{/css/dashboard.css}">
    <link rel="stylesheet" th:href="@{/css/school-setup.css}">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <!-- CSRF Token -->
    <meta name="_csrf" th:content="${_csrf.token}" />
    <meta name="_csrf_header" th:content="${_csrf.headerName}" />
    <style>
        .calendar-container {
            margin-top: 1.5rem;
        }

        .calendar-events {
            display: grid;
            gap: 1.25rem;
            grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
            align-items: stretch;
        }

        .calendar-event-card {
            background: linear-gradient(180deg, #ffffff 0%, #f8fafc 100%);
            border: 1px solid #e2e8f0;
            border-radius: 20px;
            padding: 1.5rem;
            box-shadow: 0 18px 40px rgba(15, 23, 42, 0.06);
            transition: transform 0.2s ease, box-shadow 0.2s ease, border-color 0.2s ease;
            display: flex;
            flex-direction: column;
            height: 100%;
        }

        .calendar-event-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 24px 48px rgba(15, 23, 42, 0.1);
            border-color: #cbd5e1;
        }

        .event-header,
        .event-actions,
        .event-meta,
        .event-details {
            display: flex;
        }

        .event-header {
            align-items: flex-start;
            gap: 1rem;
            flex-wrap: wrap;
        }

        .event-date-badge {
            width: 72px;
            min-width: 72px;
            border-radius: 18px;
            padding: 0.9rem 0.75rem;
            color: #fff;
            text-align: center;
            box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.2);
        }

        .event-day {
            display: block;
            font-size: 1.5rem;
            font-weight: 800;
            line-height: 1;
        }

        .event-month {
            display: block;
            margin-top: 0.2rem;
            font-size: 0.78rem;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            opacity: 0.9;
        }

        .event-info {
            flex: 1;
        }

        .event-info h3 {
            margin-bottom: 0.3rem;
            font-size: 1.15rem;
            font-weight: 700;
            color: #0f172a;
        }

        .event-session {
            margin-bottom: 0.65rem;
            color: #64748b;
        }

        .event-meta {
            gap: 0.45rem;
            flex-wrap: wrap;
        }

        .event-actions {
            gap: 0.5rem;
            flex-shrink: 0;
            margin-left: auto;
        }

        .event-details {
            flex-direction: column;
            gap: 0.75rem;
            margin-top: 1rem;
            padding-top: 1rem;
            border-top: 1px solid #e2e8f0;
            color: #334155;
            margin-top: auto;
        }

        .empty-state {
            background: #fff;
            border: 1px dashed #cbd5e1;
            border-radius: 20px;
            padding: 3rem 1.5rem;
            text-align: center;
            box-shadow: 0 18px 40px rgba(15, 23, 42, 0.05);
        }

        .empty-icon {
            font-size: 2.5rem;
            margin-bottom: 0.75rem;
        }

        @media (max-width: 767.98px) {
            .calendar-events {
                grid-template-columns: 1fr;
            }

            .event-header {
                flex-direction: column;
            }

            .event-actions {
                width: 100%;
            }

            .event-actions .btn {
                flex: 1;
            }
        }
    </style>
</head>

<body>
    <!-- Include School Header -->
    <div th:replace="~{fragments/header :: school-header}"></div>

    <main class="main-content setup-layout">
        <!-- Global Admin Sidebar -->
        <div th:replace="~{fragments/admin-sidebar :: admin-sidebar(activePage='academic')}"></div>

        <!-- Include Academic Sidebar -->

        <!-- Main Content Area -->
        <div class="setup-content">
            <div class="setup-header">
                <div>
                    <h1>School Calendar</h1>
                    <p>Manage academic terms, holidays, and school events.</p>
                </div>
                <button class="btn btn-primary" hx-get="/admin/academic/calendar/new/modal"
                    hx-target="#calendarModal .modal-dialog" hx-swap="innerHTML"
                    onclick="setTimeout(() => openModal('calendarModal'), 100)">
                    <i class="fas fa-plus me-2"></i>Add Calendar Event
                </button>
            </div>

            <!-- Calendar Events List -->
            <div class="calendar-container" id="calendar-container" th:fragment="calendar-events-list"
                th:attr="hx-swap-oob=${swapOob}">
                <div class="calendar-events" th:if="${!#lists.isEmpty(calendarEvents)}">
                    <div th:each="event : ${calendarEvents}" class="calendar-event-card"
                        th:attr="data-event-type=${event.eventType}">
                        <div class="event-header">
                            <div class="event-date-badge" th:style="'background-color: ' + ${event.color}">
                                <span class="event-day" th:text="${#temporals.format(event.startDate, 'dd')}">15</span>
                                <span class="event-month"
                                    th:text="${#temporals.format(event.startDate, 'MMM')}">Dec</span>
                            </div>
                            <div class="event-info">
                                <h3 th:text="${event.eventName}">First Term Examination</h3>
                                <p class="event-session" th:text="${event.session.sessionName}">2024-2025 Academic
                                    Session</p>
                                <div class="event-meta">
                                    <span class="event-type-badge" th:text="${event.eventType}"
                                        th:class="'badge badge-' + ${#strings.toLowerCase(event.eventType)}">EXAM</span>
                                    <span th:if="${event.isHoliday}" class="badge badge-warning">Holiday</span>
                                    <span th:if="${event.isExamPeriod}" class="badge badge-danger">Exam Period</span>
                                </div>
                            </div>
                            <div class="event-actions">
                                <button class="btn btn-sm btn-outline"
                                    th:hx-get="@{/admin/academic/calendar/{id}/modal(id=${event.id})}"
                                    hx-target="#calendarModal .modal-dialog" hx-swap="innerHTML"
                                    onclick="setTimeout(() => openModal('calendarModal'), 100)">
                                    <i class="fas fa-edit"></i>
                                </button>
                                <button class="btn btn-sm btn-danger" th:data-id="${event.id}"
                                    onclick="deleteCalendarEvent(this.getAttribute('data-id'))">
                                    <i class="fas fa-trash"></i>
                                </button>
                            </div>
                        </div>

                        <div class="event-details">
                            <div class="event-dates">
                                <span class="date-range">
                                    <i class="fas fa-calendar-day me-1"></i>
                                    <span th:text="${#temporals.format(event.startDate, 'MMM dd, yyyy')}">Dec 15,
                                        2024</span>
                                    <span th:if="${event.endDate}"> - <span
                                            th:text="${#temporals.format(event.endDate, 'MMM dd, yyyy')}">Dec 20,
                                            2024</span></span>
                                </span>
                            </div>
                            <div class="event-description" th:if="${event.description}">
                                <p th:text="${event.description}">Mid-term examination period for all classes</p>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="empty-state" th:if="${#lists.isEmpty(calendarEvents)}">
                    <div class="empty-icon">📅</div>
                    <h3>No Calendar Events</h3>
                    <p>Add your first calendar event to get started.</p>
                    <button class="btn btn-primary" hx-get="/admin/academic/calendar/new/modal"
                        hx-target="#calendarModal .modal-dialog" hx-swap="innerHTML"
                        onclick="setTimeout(() => openModal('calendarModal'), 100)">
                        Add Calendar Event
                    </button>
                </div>
            </div>
        </div>
    </main>

    <!-- Calendar Modal -->
    <div id="calendarModal" class="modal">
        <div class="modal-dialog">
            <!-- Modal content will be loaded here via HTMX -->
        </div>
    </div>

    <!-- Include HTMX -->
    <script src="https://unpkg.com/htmx.org@1.9.10"></script>
    <script th:src="@{/js/community.js}"></script>

    <script>
        // Modal functions
        window.openModal = function (modalId) {
            const modal = document.getElementById(modalId);
            if (modal) {
                modal.classList.add('active');
            }
        };

        window.closeModal = function (modalId) {
            const modal = document.getElementById(modalId);
            if (modal) {
                modal.classList.remove('active');
            }
        };

        // Delete calendar event
        window.deleteCalendarEvent = function (eventId) {
            if (confirm('Are you sure you want to delete this calendar event?')) {
                const csrfToken = document.querySelector('meta[name="_csrf"]')?.getAttribute('content');
                const csrfHeader = document.querySelector('meta[name="_csrf_header"]')?.getAttribute('content');

                const headers = {};
                if (csrfToken && csrfHeader) {
                    headers[csrfHeader] = csrfToken;
                }

                htmx.ajax('POST', `/admin/academic/calendar/delete/${eventId}`, {
                    target: 'body',
                    swap: 'none',
                    headers: headers
                });
            }
        };

        // HTMX event handlers
        document.addEventListener('htmx:afterRequest', function (event) {
            if (event.detail.successful && event.detail.xhr.responseURL.includes('save-htmx')) {
                const modalId = 'calendarModal';
                const modal = document.getElementById(modalId);
                if (modal && modal.classList.contains('active')) {
                    setTimeout(() => closeModal(modalId), 1000);
                }
            }
        });
    </script>
</body>

</html>
