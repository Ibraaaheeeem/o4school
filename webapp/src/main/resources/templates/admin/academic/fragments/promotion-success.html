<div th:fragment="promotion-success" class="text-center py-5 px-4 bg-white rounded-4 border shadow-sm">
    <div class="mb-4">
        <i class="fas fa-check-circle text-success fa-4x animate-bounce"></i>
    </div>
    <p class="text-uppercase small fw-semibold text-success mb-2">Promotion Finished</p>
    <h3 class="mb-2 fw-bold">Promotion Complete!</h3>
    <p class="text-muted mb-4" th:text="${success}">Promotion executed successfully for X students!</p>

    <div class="d-flex flex-column flex-sm-row justify-content-center gap-3">
        <button class="btn btn-primary px-4" onclick="window.location.reload()">
            <i class="fas fa-redo me-2"></i> Start New Promotion
        </button>
        <a href="/admin/academic" class="btn btn-outline-secondary px-4">
            <i class="fas fa-home me-2"></i> Back to Dashboard
        </a>
    </div>
</div>
