<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<body>
    <aside th:fragment="financial-sidebar" class="setup-sidebar">
        <style>
            .setup-sidebar .nav-item {
                border-radius: 14px;
            }

            .setup-sidebar .setup-progress-widget {
                border-radius: 18px;
                border: 1px solid #e2e8f0;
                background: linear-gradient(180deg, #ffffff 0%, #f8fafc 100%);
                box-shadow: 0 12px 30px rgba(15, 23, 42, 0.05);
            }
        </style>
        <div class="sidebar-header">
            <h3>Financial Management</h3>
        </div>
        <nav class="setup-nav">
            <a th:href="@{/admin/dashboard}" class="nav-item mobile-only">
                <span class="icon">🏠</span>
                Dashboard
            </a>
            <a th:href="@{/admin/financial}" class="nav-item">
                <span class="icon">📊</span>
                Overview
            </a>
            <a th:href="@{/admin/financial/fee-items}" class="nav-item">
                <span class="icon">💳</span>
                Fee Items
            </a>
            <a th:href="@{/admin/financial/optional-fees}" class="nav-item">
                <span class="icon">🔒</span>
                Optional Fees
            </a>
            <a th:href="@{/admin/financial/payments}" class="nav-item">
                <span class="icon">💰</span>
                Payments
            </a>
            <a th:href="@{/admin/financial/analytics}" class="nav-item">
                <span class="icon">📈</span>
                Analytics
            </a>
        </nav>

        <div class="setup-progress-widget">
            <h4>Financial Stats</h4>
            <div class="stats-grid">
                <div class="stat-item">
                    <span class="stat-number" th:text="${financialStats?.feeItems ?: 0}">0</span>
                    <span class="stat-label">Fee Items</span>
                </div>
                <div class="stat-item">
                    <span class="stat-number" th:text="${financialStats?.classFeeItems ?: 0}">0</span>
                    <span class="stat-label">Assignments</span>
                </div>
                <div class="stat-item">
                    <span class="stat-number" th:text="${paymentStats?.totalPayments ?: 0}">0</span>
                    <span class="stat-label">Payments</span>
                </div>
            </div>
        </div>
    </aside>
</body>

</html>
