<div th:fragment="empty(icon, title, message)" class="text-center py-5 px-4 bg-white border rounded-4 shadow-sm">
	<div class="mb-3 text-muted" style="font-size: 2.5rem; opacity: 0.7;">
		<i th:class="${icon ?: 'fas fa-inbox'}"></i>
	</div>
	<h4 class="fw-bold mb-2" th:text="${title ?: 'Nothing here yet'}">Nothing here yet</h4>
	<p class="text-muted mb-0" th:text="${message ?: 'There is no content to display right now.'}">There is no content to display right now.</p>
</div>
