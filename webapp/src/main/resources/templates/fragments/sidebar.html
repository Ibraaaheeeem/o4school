<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<body>
    <aside th:fragment="sidebar" class="setup-sidebar">
        <style>
            .setup-sidebar {
                border-right: 1px solid #e2e8f0;
            }

            .setup-sidebar .nav-item {
                border-radius: 14px;
                transition: transform 0.2s ease, background-color 0.2s ease;
            }

            .setup-sidebar .nav-item:hover {
                transform: translateX(2px);
            }

            .setup-progress-widget {
                margin-top: 1.5rem;
                padding: 1rem;
                border-radius: 18px;
                background: linear-gradient(180deg, #ffffff 0%, #f8fafc 100%);
                border: 1px solid #e2e8f0;
                box-shadow: 0 12px 30px rgba(15, 23, 42, 0.05);
            }
        </style>
        <div class="sidebar-header">
            <h3>Setup Menu</h3>
        </div>
        <nav class="setup-nav">
            <a th:href="@{/admin/school-setup}" th:classappend="${requestURI == '/admin/school-setup' ? 'active' : ''}"
                class="nav-item">
                <span class="icon">📊</span>
                Overview
            </a>
            <a th:href="@{/admin/school-setup/school-details}"
                th:classappend="${requestURI.contains('school-details') ? 'active' : ''}" class="nav-item">
                <span class="icon">🏫</span>
                School Details
            </a>
            <a th:href="@{/admin/school-setup/academic-structure}"
                th:classappend="${requestURI.contains('academic-structure') ? 'active' : ''}" class="nav-item">
                <span class="icon">🏛️</span>
                Academic Structure
            </a>
            <a th:href="@{/admin/school-setup/subjects}"
                th:classappend="${requestURI.contains('subjects') ? 'active' : ''}" class="nav-item">
                <span class="icon">📚</span>
                Subjects
            </a>
            <a th:href="@{/admin/school-setup/landing-page}"
                th:classappend="${requestURI.contains('landing-page') ? 'active' : ''}" class="nav-item">
                <span class="icon">🌐</span>
                Landing Page
            </a>
            <a th:href="@{/admin/school-setup/custom-domain}"
                th:classappend="${requestURI.contains('custom-domain') ? 'active' : ''}" class="nav-item">
                <span class="icon">🌍</span>
                Custom Domain
            </a>
            <a th:href="@{/admin/school-setup/subscriptions}"
                th:classappend="${requestURI.contains('subscriptions') ? 'active' : ''}" class="nav-item">
                <span class="icon">💳</span>
                Subscriptions & Billing
            </a>
        </nav>

        <div class="setup-progress-widget" th:if="${setupProgress != null}">
            <h4>Setup Progress</h4>
            <div class="progress-bar small">
                <div class="progress-fill" th:style="'width: ' + ${setupProgress.progressPercentage} + '%'"></div>
            </div>
            <p class="progress-text small">
                <span th:text="${setupProgress.progressPercentage}">0</span>% Complete
            </p>
        </div>
    </aside>
</body>

</html>
