<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<body>
    <div th:fragment="success-alert">
        <div class="alert alert-success border-0 rounded-4 shadow-sm px-4 py-3 d-flex align-items-center gap-2" role="alert">
            <i class="fas fa-check-circle"></i>
            <span th:text="${success}">Operation successful!</span>
        </div>
    </div>
</body>

</html>
