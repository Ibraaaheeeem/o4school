<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>4School - Staff Dashboard</title>
    <link rel="stylesheet" th:href="@{/css/common.css}">
    <link rel="stylesheet" th:href="@{/css/dashboard.css}">
    <link rel="stylesheet" th:href="@{/css/assessments.css}">
    <style>
        .dashboard-container .welcome-section,
        .dashboard-container .dashboard-card,
        .dashboard-container .content-panel {
            border-radius: 22px;
        }
    </style>
</head>

<body>
    <!-- Include School Header -->
    <div th:replace="~{fragments/header :: school-header}"></div>

    <div class="dashboard-container role-staff">
        <div class="alert alert-warning" th:if="${isViewAs}"
            style="margin-bottom: 20px; border-left: 5px solid #f59e0b; background-color: #fffbeb; color: #92400e; padding: 1rem; border-radius: 0.5rem; display: flex; align-items: center; gap: 0.5rem;">
            <i class="fas fa-eye"></i>
            <span><strong>Viewing as Admin:</strong> You are currently viewing the dashboard of <span
                    th:text="${viewingAsName}">Staff Name</span>.</span>
        </div>

        <div class="welcome-section">
            <div class="welcome-text">
                <h1>Welcome back, <span th:text="${user.fullName}">Staff</span>!</h1>
                <p>Staff Dashboard • <span
                        th:text="${#dates.format(#dates.createNow(), 'EEEE, MMMM dd, yyyy')}">Date</span></p>
            </div>
            <div class="welcome-stats">
                <div class="stat-badge">
                    <span class="value" th:text="${classCount ?: 0}">0</span>
                    <span class="label">Classes</span>
                </div>
            </div>
        </div>

        <div style="margin-bottom: 1.5rem; display: flex; justify-content: flex-end;">
            <a th:href="@{/dashboard/messaging}" class="btn btn-primary"
                style="display: flex; align-items: center; gap: 0.5rem; position: relative; background: #4f46e5; color: white; padding: 0.5rem 1rem; border-radius: 8px; text-decoration: none; font-weight: 600;">
                <i class="fas fa-envelope"></i> Messages
                <span id="nav-unread-badge"
                    style="display: none; background: #ef4444; color: white; padding: 2px 6px; border-radius: 12px; font-size: 0.75rem; font-weight: bold; margin-left: 0.5rem;"></span>
            </a>
        </div>

        <div class="dashboard-grid">
            <a href="/staff/classes" class="dashboard-card">
                <div class="card-header">
                    <span class="card-title">My Classes</span>
                    <div class="card-icon"><i class="fas fa-chalkboard"></i></div>
                </div>
                <div class="card-value" th:text="${classCount ?: 0}">0</div>
                <div class="card-trend">
                    <span class="trend-neutral">Assigned Classes</span>
                </div>
                <span class="card-link">
                    View Classes <i class="fas fa-arrow-right"></i>
                </span>
            </a>

            <a href="/staff/reports/class" class="dashboard-card">
                <div class="card-header">
                    <span class="card-title">Class Reports</span>
                    <div class="card-icon"><i class="fas fa-file-invoice"></i></div>
                </div>
                <div class="card-value" style="font-size: 1.5rem; color: #64748b;"><i class="fas fa-list-check"></i>
                </div>
                <div class="card-trend">
                    <span class="trend-neutral">Manage Assessments</span>
                </div>
                <span class="card-link">
                    View Reports <i class="fas fa-arrow-right"></i>
                </span>
            </a>

        </div>

        <!-- Your Recent Activity Widget -->
        <div class="content-panel">
            <div class="section-header">
                <h2 class="section-title">Recent Activity</h2>
            </div>
            <div th:replace="~{fragments/activity-widget :: user-activity-widget(userId=${user?.id})}">
            </div>
        </div>
    </div>

    <!-- Include activity widget script -->
    <div th:replace="~{fragments/activity-widget :: activity-widget-script}"></div>
    <script th:src="@{/js/dashboard-tabs.js}"></script>
    <script>
        // Fetch unread count on load if possible
        document.addEventListener("DOMContentLoaded", async () => {
            try {
                const response = await fetch('/dashboard/messaging/unread-count');
                const result = await response.json();
                if (result && result.count > 0) {
                    const badge = document.getElementById('nav-unread-badge');
                    if (badge) {
                        badge.innerText = result.count;
                        badge.style.display = 'inline-block';
                    }
                }
            } catch (e) { console.error("Could not fetch unread count"); }
        });
    </script>
</body>

</html>
