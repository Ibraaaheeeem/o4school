<!-- THREAD LIST FRAGMENT -->
<div th:fragment="thread-list">
    <div th:each="thread : ${threads}" class="conversation-item" th:attr="data-thread-id=${thread.id}"
        onclick="loadThread(this.getAttribute('data-thread-id'), this)">
        <div class="avatar-circle" style="background: #f1f5f9; color: #4f46e5;"
            th:text="${#strings.substring(thread.otherParticipantName, 0, 1)}">M</div>
        <div class="conv-info">
            <div style="display: flex; flex-direction: column; overflow: hidden;">
                <span class="conv-name"
                    style="font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;"
                    th:text="${thread.otherParticipantName}">Name</span>
                <span style="font-size: 0.7rem; color: #64748b;" th:text="${thread.otherParticipantRole}">Role</span>
            </div>
            <span class="conv-last-msg" style="margin-top: 4px; font-weight: 500; font-size: 0.75rem; color: #4f46e5;"
                th:text="${thread.subject}">Subject</span>
            <span class="conv-last-msg" th:text="${thread.lastMessagePreview}">Last message
                content...</span>
        </div>
        <div style="text-align: right; min-width: 60px;">
            <span style="font-size: 0.7rem; color: #94a3b8;"
                th:text="${#temporals.format(thread.updatedAt, 'HH:mm')}">12:00</span>
            <div th:if="${thread.unreadCount > 0}" style="margin-top: 4px;">
                <span
                    style="background: #ef4444; color: white; padding: 2px 6px; border-radius: 12px; font-size: 0.65rem; font-weight: bold;"
                    th:text="${thread.unreadCount}">1</span>
            </div>
        </div>
    </div>
    <div th:if="${#lists.isEmpty(threads)}" style="padding: 2rem; text-align: center; color: #94a3b8;">
        <p style="font-size: 0.85rem;">No messages found</p>
    </div>
</div>

<!-- CHAT THREAD FRAGMENT -->
<div th:fragment="chat-thread" style="flex: 1; display: flex; flex-direction: column; min-height: 0;">
    <div class="chat-header" style="border-bottom: 1px solid #e2e8f0; padding: 1rem 1.5rem; background: white;">
        <div style="display: flex; align-items: center; justify-content: space-between;">
            <div style="display: flex; align-items: center; gap: 1rem;">
                <button class="hamburger-btn mobile-header"
                    style="display: none; padding: 0.5rem; background: none; border: none; font-size: 1.25rem; color: #475569; cursor: pointer;"
                    onclick="toggleSidebar()">
                    <i class="fas fa-bars"></i>
                </button>
                <h3 style="margin: 0; font-size: 1.1rem; color: #0f172a;" id="active-thread-subject">Message Thread</h3>
            </div>
        </div>
    </div>
    <div id="message-container"
        style="flex: 1; overflow-y: auto; padding: 1.5rem; display: flex; flex-direction: column; gap: 1rem; background: #f8fafc;">
        <div th:each="msg : ${messages}"
            th:class="${msg.isMine ? 'message-bubble outgoing' : 'message-bubble incoming'}">

            <div style="font-size: 0.7rem; color: #64748b; margin-bottom: 4px; font-weight: bold;">
                <span th:text="${msg.senderName}">Sender Name</span>
                <span th:if="${msg.senderName != 'Me'}" th:text="' (' + ${msg.senderRole} + ')'"
                    style="font-weight: normal; font-style: italic;">(Role)</span>
            </div>

            <div th:text="${msg.content}">Message text...</div>
            <div class="message-meta">
                <span th:text="${#temporals.format(msg.createdAt, 'HH:mm')}">12:00</span>
            </div>
        </div>
        <div th:if="${#lists.isEmpty(messages)}" class="empty-chat">
            <p>No messages yet.</p>
        </div>
    </div>
    <div class="chat-input-area" style="padding: 1rem; background: white; border-top: 1px solid #e2e8f0;">
        <div class="input-wrapper" style="display: flex; gap: 0.5rem; align-items: center;">
            <input type="hidden" id="active-thread-id" th:value="${threadId}">
            <textarea id="reply-input" class="chat-input" placeholder="Type your reply here..."
                style="flex: 1; border: 1px solid #e2e8f0; border-radius: 20px; padding: 0.75rem 1rem; resize: none; min-height: 44px; max-height: 120px; font-family: inherit; font-size: 0.9rem;"
                onkeydown="if(event.key === 'Enter' && !event.shiftKey) { event.preventDefault(); sendReply(); }"></textarea>
            <button onclick="sendReply()" class="btn-send"
                style="background: #4f46e5; color: white; border: none; width: 44px; height: 44px; border-radius: 50%; display: flex; align-items: center; justify-content: center; cursor: pointer; transition: background 0.2s;">
                <svg width="20" height="20" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                        d="M12 19l9 2-9-18-9 18 9-2zm0 0v-8" />
                </svg>
            </button>
        </div>
    </div>
</div>

<!-- NEW MESSAGE MODAL -->
<div th:fragment="new-message-modal">
    <div id="new-message-modal" class="modal-overlay" onclick="closeNewMessageModal(event)">
        <div class="modal-content" style="max-width: 600px;" onclick="event.stopPropagation()">
            <form id="new-message-form" onsubmit="createNewThread(event)">
                <!-- Modal Header -->
                <div class="modal-header">
                    <div>
                        <h3 style="margin: 0; font-size: 1.25rem; color: #0f172a;">New Message</h3>
                    </div>
                    <button type="button" onclick="closeNewMessageModal()"
                        style="background: #f1f5f9; border: none; width: 32px; height: 32px; border-radius: 50%; font-size: 1.25rem; cursor: pointer; color: #64748b; display: flex; align-items: center; justify-content: center;">&times;</button>
                </div>

                <!-- Modal Body -->
                <div class="modal-body" style="padding: 1.5rem;">

                    <div class="form-group" style="margin-bottom: 1.5rem;">
                        <label
                            style="display: block; font-size: 0.85rem; font-weight: 600; color: #475569; margin-bottom: 0.5rem;">Recipient</label>
                        <select id="recipient-select" name="recipientId" required
                            style="width: 100%; border: 1px solid #e2e8f0; border-radius: 8px; height: 44px; padding: 0 1rem; outline: none;">
                            <option value="">Select a contact...</option>
                            <!-- Options loaded dynamically via JS -->
                        </select>
                    </div>

                    <div class="form-group" style="margin-bottom: 1.5rem;">
                        <label
                            style="display: block; font-size: 0.85rem; font-weight: 600; color: #475569; margin-bottom: 0.5rem;">Subject</label>
                        <input type="text" id="message-subject" name="subject" required
                            placeholder="e.g. Inquiry regarding math class"
                            style="width: 100%; border: 1px solid #e2e8f0; border-radius: 8px; height: 44px; padding: 0 1rem; outline: none;">
                    </div>

                    <div class="form-group">
                        <label
                            style="display: block; font-size: 0.85rem; font-weight: 600; color: #475569; margin-bottom: 0.5rem;">Message</label>
                        <textarea id="message-content" name="content" required placeholder="Write your message here..."
                            style="width: 100%; border: 1px solid #e2e8f0; border-radius: 8px; min-height: 120px; padding: 1rem; outline: none; resize: vertical; font-family: inherit;"></textarea>
                    </div>
                </div>

                <!-- Footer -->
                <div class="modal-footer"
                    style="padding: 1rem 1.5rem; border-top: 1px solid #e2e8f0; display: flex; justify-content: flex-end; gap: 1rem;">
                    <button type="button" onclick="closeNewMessageModal()"
                        style="padding: 0.5rem 1rem; background: #f1f5f9; color: #475569; border: none; border-radius: 8px; font-weight: 600; cursor: pointer;">Cancel</button>
                    <button type="submit" id="submit-message-btn"
                        style="padding: 0.5rem 1.5rem; background: #4f46e5; color: white; border: none; border-radius: 8px; font-weight: 600; cursor: pointer;">Send
                        Message</button>
                </div>
            </form>
        </div>
    </div>
</div>
