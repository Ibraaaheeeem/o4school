<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>4School - View Lesson</title>
    <link rel="stylesheet" th:href="@{/css/common.css}">
    <link rel="stylesheet" th:href="@{/css/dashboard.css}">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        :root {
            --primary-color: #4f46e5;
            --secondary-color: #e0e7ff;
            --border-light: #e2e8f0;
            --text-primary: #1e293b;
            --text-secondary: #64748b;
            --text-muted: #94a3b8;
            --bg-light: #f8fafc;
            --bg-lighter: #f1f5f9;
        }

        body {
            background: linear-gradient(135deg, #f8fafc 0%, #f1f5f9 100%);
        }

        .lesson-container {
            max-width: 1100px;
            margin: 0 auto;
            padding: 2.5rem 1.5rem;
            animation: fadeIn 0.4s ease-out;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .back-link {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            color: var(--text-secondary);
            text-decoration: none;
            font-weight: 700;
            margin-bottom: 2rem;
            transition: all 0.2s;
            font-size: 0.9rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .back-link:hover {
            color: var(--primary-color);
            transform: translateX(-4px);
        }

        .back-link i {
            font-size: 0.8rem;
        }

        .lesson-card {
            background: white;
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 10px 40px rgba(15, 23, 42, 0.1);
            border: 1px solid var(--border-light);
            transition: all 0.3s;
        }

        .lesson-card:hover {
            box-shadow: 0 20px 60px rgba(15, 23, 42, 0.12);
        }

        .lesson-header {
            padding: 3.5rem 3.5rem;
            background: linear-gradient(135deg, #1e293b 0%, #334155 60%, #4f46e5 100%);
            color: white;
            position: relative;
            overflow: hidden;
        }

        .lesson-header::before {
            content: '';
            position: absolute;
            top: -50%;
            right: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle, rgba(255,255,255,0.1) 0%, transparent 70%);
            animation: shimmer 20s infinite;
        }

        @keyframes shimmer {
            0%, 100% {
                transform: translate(0, 0);
            }
            50% {
                transform: translate(10px, 10px);
            }
        }

        .lesson-header h1 {
            font-size: 2.75rem;
            font-weight: 800;
            margin: 1rem 0 0.75rem 0;
            letter-spacing: -0.02em;
            position: relative;
            z-index: 1;
        }

        .lesson-breadcrumb {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            font-size: 0.9rem;
            opacity: 0.85;
            font-weight: 500;
            position: relative;
            z-index: 1;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .lesson-body {
            padding: 3.5rem;
        }

        .lesson-content {
            font-size: 1.1rem;
            line-height: 1.85;
            color: var(--text-secondary);
        }

        .lesson-content h2 {
            font-size: 1.75rem;
            font-weight: 800;
            color: var(--text-primary);
            margin: 2.5rem 0 1rem 0;
            padding-bottom: 1rem;
            border-bottom: 2px solid var(--bg-lighter);
        }

        .lesson-content h3 {
            font-size: 1.35rem;
            font-weight: 700;
            color: var(--text-primary);
            margin: 2rem 0 0.75rem 0;
        }

        .lesson-content h4 {
            font-size: 1.1rem;
            font-weight: 700;
            color: var(--text-primary);
            margin: 1.5rem 0 0.5rem 0;
        }

        .lesson-content p {
            margin-bottom: 1.5rem;
        }

        .lesson-content ul,
        .lesson-content ol {
            margin-bottom: 1.5rem;
            padding-left: 2rem;
        }

        .lesson-content li {
            margin-bottom: 0.6rem;
            line-height: 1.8;
        }

        .lesson-content blockquote {
            border-left: 4px solid var(--primary-color);
            padding: 1.25rem 1.5rem;
            background: var(--secondary-color);
            border-radius: 0 8px 8px 0;
            margin: 1.5rem 0;
            font-style: italic;
            color: var(--text-secondary);
        }

        .lesson-content code {
            background: var(--bg-light);
            padding: 0.25rem 0.5rem;
            border-radius: 4px;
            font-family: 'Courier New', monospace;
            font-size: 0.9em;
            color: var(--primary-color);
        }

        .lesson-content pre {
            background: var(--text-primary);
            color: #f1f5f9;
            padding: 1.5rem;
            border-radius: 12px;
            overflow-x: auto;
            margin: 1.5rem 0;
            line-height: 1.5;
        }

        .lesson-content pre code {
            background: none;
            color: #f1f5f9;
            padding: 0;
        }

        /* Media Styles */
        .media-container {
            background: var(--bg-lighter);
            border-radius: 14px;
            margin: 2.5rem 0;
            aspect-ratio: 16 / 9;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            position: relative;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.08);
            border: 1px solid var(--border-light);
        }

        .media-container iframe {
            width: 100%;
            height: 100%;
            border: none;
        }

        .media-placeholder {
            text-align: center;
            color: var(--text-muted);
        }

        .media-placeholder i {
            display: block;
            font-size: 3rem;
            margin-bottom: 1rem;
            opacity: 0.5;
        }

        .lesson-body > div:nth-child(n+2) .media-container {
            margin-top: 1.5rem;
        }

        /* Footer Navigation */
        .lesson-footer {
            padding: 2rem 3.5rem;
            background: var(--bg-light);
            border-top: 1px solid var(--border-light);
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 1.5rem;
            flex-wrap: wrap;
        }

        .nav-btn {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            padding: 0.95rem 2rem;
            border-radius: 12px;
            font-weight: 700;
            text-decoration: none;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            font-size: 0.9rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            border: 1px solid var(--border-light);
        }

        .btn-prev {
            color: var(--text-secondary);
            background: white;
            border-color: var(--border-light);
        }

        .btn-prev:hover {
            color: var(--primary-color);
            border-color: var(--primary-color);
            transform: translateX(-3px);
        }

        .btn-next {
            background: var(--primary-color);
            color: white;
            border-color: var(--primary-color);
            margin-left: auto;
        }

        .btn-next:hover {
            background: #4338ca;
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(79, 70, 229, 0.3);
        }

        /* Empty Content */
        .lesson-empty {
            text-align: center;
            padding: 4rem 2rem;
            color: var(--text-muted);
        }

        .lesson-empty i {
            font-size: 3.5rem;
            margin-bottom: 1rem;
            opacity: 0.3;
        }

        .lesson-empty p {
            font-size: 1.05rem;
            font-style: italic;
            margin: 0;
        }

        /* Responsive Design */
        @media (max-width: 768px) {
            .lesson-container {
                padding: 1.5rem 1rem;
            }

            .lesson-header {
                padding: 2.5rem 2rem;
            }

            .lesson-header h1 {
                font-size: 2rem;
            }

            .lesson-body {
                padding: 2rem;
            }

            .lesson-footer {
                padding: 1.5rem 2rem;
                flex-direction: column;
                align-items: stretch;
            }

            .btn-next {
                margin-left: 0;
            }

            .nav-btn {
                justify-content: center;
            }

            .lesson-content h2 {
                font-size: 1.5rem;
            }

            .lesson-content h3 {
                font-size: 1.15rem;
            }

            .media-container {
                margin: 2rem 0;
                border-radius: 12px;
            }
        }

        @media (max-width: 480px) {
            .lesson-header {
                padding: 2rem 1.5rem;
            }

            .lesson-header h1 {
                font-size: 1.5rem;
                margin: 0.75rem 0 0.5rem 0;
            }

            .lesson-breadcrumb {
                font-size: 0.8rem;
            }

            .lesson-body {
                padding: 1.5rem;
            }

            .lesson-content {
                font-size: 1rem;
                line-height: 1.7;
            }

            .lesson-content h2 {
                font-size: 1.25rem;
                margin: 1.75rem 0 0.75rem 0;
                padding-bottom: 0.75rem;
            }

            .lesson-content h3 {
                font-size: 1rem;
                margin: 1.5rem 0 0.5rem 0;
            }

            .lesson-footer {
                padding: 1.25rem 1.5rem;
                gap: 0.75rem;
            }

            .nav-btn {
                padding: 0.85rem 1.5rem;
                font-size: 0.8rem;
                flex: 1;
            }

            .media-container {
                margin: 1.5rem 0;
            }
        }
    </style>
</head>

<body class="bg-light">
    <!-- Include School Header -->
    <div th:replace="~{fragments/header :: school-header}"></div>

    <main class="lesson-container">
        <a href="javascript:history.back()" class="back-link">
            <i class="fas fa-arrow-left"></i>
            <span>Back to Content</span>
        </a>

        <article class="lesson-card">
            <header class="lesson-header">
                <div class="lesson-breadcrumb">
                    <span th:text="${lesson.topic}">Topic Name</span>
                    <i class="fas fa-chevron-right" style="font-size: 0.7rem;"></i>
                    <span>Lesson Material</span>
                </div>
                <h1 th:text="${lesson.title}">The Concept of Infinity</h1>
            </header>

            <div class="lesson-body">
                <div class="lesson-content">
                    <!-- If the lesson has HTML content, use th:utext -->
                    <div th:if="${lesson.content != null}" th:utext="${lesson.content}">
                        Sample lesson content would appear here...
                    </div>

                    <!-- If content is null, show a message -->
                    <div th:if="${lesson.content == null}" class="text-center py-10">
                        <p class="text-lg italic text-slate-400">This lesson does not have any text content yet.</p>
                    </div>

                    <!-- Media Section -->
                    <div class="media-container" th:if="${lesson.video_url != null}">
                        <iframe
                            th:if="${lesson.video_url.contains('youtube.com') || lesson.video_url.contains('youtu.be')}"
                            width="100%" height="100%" th:src="${lesson.video_url.replace('watch?v=', 'embed/')}"
                            frameborder="0" allowfullscreen></iframe>

                        <div th:unless="${lesson.video_url.contains('youtube.com') || lesson.video_url.contains('youtu.be')}"
                            class="media-placeholder">
                            <i class="fas fa-video"></i>
                            <p>Video content available at: <br /><a th:href="${lesson.video_url}" target="_blank"
                                    th:text="${lesson.video_url}">URL</a></p>
                        </div>
                    </div>
                </div>
            </div>

            <footer class="lesson-footer">
                <a href="javascript:history.back()" class="nav-btn btn-prev">
                    <i class="fas fa-arrow-left"></i>
                    <span>Previous Lesson</span>
                </a>
                <button onclick="window.scrollTo({top: 0, behavior: 'smooth'})" class="nav-btn btn-next">
                    <span>Complete Lesson</span>
                    <i class="fas fa-check-circle"></i>
                </button>
            </footer>
        </article>
    </main>
</body>

</html>
